<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Página no encontrada · Ruta a la Plaza</title>
<meta name="robots" content="noindex"><link rel="icon" href="/favicon.png"><style>:root{--bg:#F1F5F0;--surface:#fff;--surface2:#E8EFE9;--ink:#14231E;--muted:#566962;--line:#D5DFD8;--accent:#A3202D;--pine:#1D5A49;--good:#1B7A4D}

nav.mig{font-size:.9rem;color:var(--muted);margin-top:14px}nav.mig a{color:var(--muted)}
