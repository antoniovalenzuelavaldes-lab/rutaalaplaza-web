<style>
/* Concepto: biblioteca de noche junto a la Alhambra. Verde pino y acento granada. Sin fuentes ni scripts de terceros. */
:root{
  --bg:#F1F5F0; --surface:#FFFFFF; --surface2:#E8EFE9; --ink:#14231E; --muted:#566962; --line:#D5DFD8;
  --accent:#A3202D; --accent-ink:#FFFFFF; --pine:#1D5A49; --gold:#9A6A12; --good:#1B7A4D; --bad:#B3261E; --goodbg:#E3F3EA; --badbg:#FBE6E4;
  --f-display:'Bricolage Grotesque',Georgia,'Segoe UI',system-ui,sans-serif; --f-body:system-ui,'Segoe UI',Roboto,sans-serif; --f-mono:ui-monospace,Consolas,'SFMono-Regular',monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1916; --surface:#162621; --surface2:#1D312B; --ink:#E8F0EC; --muted:#92A7A0; --line:#2B4039;
  --accent:#E8737D; --accent-ink:#1A0A0C; --pine:#62C7A6; --gold:#E3B455; --good:#59C58F; --bad:#F08A82; --goodbg:#17372B; --badbg:#3B1E1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1916; --surface:#162621; --surface2:#1D312B; --ink:#E8F0EC; --muted:#92A7A0; --line:#2B4039;
  --accent:#E8737D; --accent-ink:#1A0A0C; --pine:#62C7A6; --gold:#E3B455; --good:#59C58F; --bad:#F08A82; --goodbg:#17372B; --badbg:#3B1E1C; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);padding:0 max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.8rem,5.5vw,2.7rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--pine)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:880px;margin:0 auto}
.top{border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:8px;margin-right:auto;color:var(--ink);text-decoration:none}
.brand i{width:22px;height:22px;border-radius:50% 50% 50% 8px;background:var(--accent);display:inline-block;transform:rotate(-20deg)}
.chip{font-family:var(--f-mono);font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
main{padding-top:26px;display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.aviso{background:var(--surface2);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
@media (max-width:719px){.grid2{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:700;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:7px 12px;font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:12px}
.hero{display:grid;gap:14px;padding:12px 0 4px}
.hero p.lead{font-size:1.1rem;max-width:62ch}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>b{display:block;height:100%;background:var(--pine);border-radius:99px}
.tema h3{margin:6px 0}
.bloqueado{background:var(--surface2);border-style:dashed}
.bloqueado h3{color:var(--muted)}
h2[id]{scroll-margin-top:12px}
.apunte h3{margin:18px 0 6px;color:var(--pine)}
.apunte ul{margin:6px 0;padding-left:1.2em}
.apunte li{margin:5px 0}
.apunte p{margin:6px 0}
.clave li{margin:6px 0}
.nota{border-left:4px solid var(--accent);padding:6px 12px;background:var(--surface2);border-radius:0 8px 8px 0;margin:8px 0}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;margin:8px 0}
.opt:hover:not([disabled]){border-color:var(--pine)}
.opt .l{font-family:var(--f-mono);font-weight:700;min-width:1.4em}
.opt.ok{border-color:var(--good);background:var(--goodbg)}
.opt.ko{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.fb{border-radius:10px;padding:12px 14px;margin-top:10px;border:1px solid var(--line);background:var(--surface2)}
.fb.ok{border-color:var(--good)}.fb.ko{border-color:var(--bad)}
.cita{font-size:.92rem;color:var(--muted);margin-top:8px}

.big{font-family:var(--f-display);font-size:3rem;font-weight:800;line-height:1}

footer a{color:var(--muted)}
input[type=email],input[type=text]{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
label.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
label.chk input{margin-top:5px;width:18px;height:18px;flex:none}
.err{color:var(--bad);font-weight:600}

.tabs a{padding:8px 14px;border-radius:99px;font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.hero.hoy{grid-template-columns:1fr auto;gap:22px;align-items:center}

.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:1.9rem;font-weight:800}
.ring small{display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);font-weight:500;text-align:center;margin-top:-6px}
.today{border-left:6px solid var(--accent)}
.opo{border-left:6px solid var(--pine)}
.opo h2{margin:4px 0 2px}
.programa{margin:10px 4px 4px;padding-left:1.6em;display:grid;gap:6px}
.opo-datos{display:flex;flex-wrap:wrap;gap:6px 18px;list-style:none;padding:0;margin:8px 0 0;font-size:.9rem;color:var(--muted)}
.today h2{margin:4px 0 6px}
.bar.acc>b{background:var(--accent)}
.pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);white-space:nowrap;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.04em}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);border-color:var(--good);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--gold) 18%,transparent);border-color:var(--gold);color:var(--gold)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);border-color:var(--bad);color:var(--bad)}
.badge{font-size:.82rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line)}
.check{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:22px;height:22px;accent-color:var(--pine);margin-top:2px}
.check.done .t{text-decoration:line-through;color:var(--muted)}
.check .t{font-weight:600}
.check .d{font-size:.9rem;color:var(--muted)}
.fila{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);text-decoration:none}
.fila:hover{border-color:var(--pine)}
.fila .n{font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--accent)}
.fila .tt{font-weight:600;line-height:1.3}
.fila .sub{font-size:.82rem;color:var(--muted)}
.fila.off{opacity:.7}
.list{display:grid;gap:8px}
.card.flat{background:transparent;border-style:dashed}
.warnbox{border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent);border-radius:12px;padding:12px 14px;font-size:.92rem}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 16px;margin:0}
.kv dt{font-weight:700}.kv dd{margin:0}
@media (max-width:719px){.kv{grid-template-columns:1fr}}
.week{display:grid;gap:6px}
.day{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none}
.day.hoy{border:2px solid var(--accent)}
.day.pas{opacity:.55}
.day .dt{font-family:var(--f-mono);font-size:.82rem;font-weight:600}
details.fase>summary,details.sub>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
details.fase>summary::-webkit-details-marker,details.sub>summary::-webkit-details-marker{display:none}
details.fase>summary{padding:12px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:700}
details.fase>summary::before,details.sub>summary::before{content:"▸";display:inline-block;margin-right:8px;transition:transform .15s}
details.fase[open]>summary::before,details.sub[open]>summary::before{transform:rotate(90deg)}
details.fase>summary>span:first-child,details.sub>summary>span:first-child{margin-right:auto}
details.fase>.week,details.fase>details{margin-top:8px}
details.sub{margin-left:10px}
details.sub>summary{padding:9px 12px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);font-weight:600}
details.sub>.week{margin-top:6px}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.7rem;line-height:1}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:22px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);display:block}
.dots i.on{background:var(--pine);border-color:var(--pine)}
.dots i.now{outline:2px solid var(--accent)}
select,input[type=date]{font:inherit;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.factura table{width:100%}
@media print{.top,.tabs,footer,.noprint,.toast{display:none!important}body{background:#fff;color:#000;padding:0}.card{border:0;padding:0}.aviso{border:2px solid #000}}

<script>
const DATOS={"temas":{"g1":{"id":"g1","num":1,"titulo":"La Constitución Española","alcance":"Título Preliminar; Título I (derechos y deberes fundamentales); Título IV (Gobierno y Administración).","bloque":"General","fuentes":["BOE-A-1978-31229 (Constitución Española, texto consolidado)"],"notas":["Para este tema te conviene dominar al detalle: los valores superiores (art. 1.1), las garantías del art. 9.3, el art. 14 (igualdad), el art. 17.2 (72 horas de detención), el art. 23.2 (acceso a funciones públicas), el art. 27.10 (autonomía de las Universidades) y los principios de la Administración (art. 103).","Se pregunta con frecuencia el número exacto o la lista completa. Cuenta los elementos de cada lista (por ejemplo, los cinco principios del art. 103.1) para detectar la opción falsa."],"apuntes":[{"h":"Título Preliminar (arts. 1 a 9)","t":"- **Art. 1.1**: España es un Estado **social y democrático de Derecho**. Valores superiores: **libertad, justicia, igualdad y pluralismo político**.\n- **Art. 1.2**: la soberanía nacional reside en el **pueblo español**, del que emanan los poderes del Estado.\n- **Art. 1.3**: la forma política del Estado es la **Monarquía parlamentaria**.\n- **Art. 2**: unidad indisoluble de la Nación española; reconoce y garantiza el derecho a la autonomía de las **nacionalidades y regiones** y la solidaridad entre ellas.\n- **Art. 3**: el **castellano** es la lengua española oficial del Estado; las demás lenguas españolas serán también oficiales en sus Comunidades Autónomas.\n- **Art. 4**: bandera de España (rojo, amarillo y rojo; la franja amarilla de doble anchura). **Art. 5**: la capital del Estado es **Madrid**.\n- **Art. 6**: partidos políticos. **Art. 7**: sindicatos y asociaciones empresariales. **Art. 8**: Fuerzas Armadas (garantizan la soberanía e independencia de España y defienden su integridad territorial y el ordenamiento constitucional).\n- **Art. 9**: los ciudadanos y los poderes públicos están **sujetos a la Constitución y al resto del ordenamiento**. Garantiza: **legalidad, jerarquía normativa, publicidad de las normas, irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales, seguridad jurídica, responsabilidad e interdicción de la arbitrariedad** de los poderes públicos."},{"h":"Título I: estructura","t":"El Título I se llama «De los derechos y deberes fundamentales» (arts. 10 a 55) y tiene cinco capítulos:\n- **Cap. I** (arts. 11-13): españoles y extranjeros.\n- **Cap. II** (arts. 14-38): derechos y libertades. **Sección 1.ª** (arts. 15-29): derechos fundamentales y libertades públicas. **Sección 2.ª** (arts. 30-38): derechos y deberes de los ciudadanos.\n- **Cap. III** (arts. 39-52): principios rectores de la política social y económica.\n- **Cap. IV** (arts. 53-54): garantías de las libertades y derechos fundamentales.\n- **Cap. V** (art. 55): suspensión de los derechos y libertades.\n\n**Art. 10**: la dignidad de la persona, los derechos inviolables que le son inherentes y el libre desarrollo de la personalidad son fundamento del orden político y de la paz social. Las normas sobre derechos fundamentales se interpretan de conformidad con la **Declaración Universal de Derechos Humanos** y los tratados internacionales ratificados por España."},{"h":"Capítulo I: españoles y extranjeros","t":"- **Art. 11**: la nacionalidad se adquiere, conserva y pierde según la ley. **Ningún español de origen podrá ser privado de su nacionalidad.**\n- **Art. 12**: los españoles son mayores de edad a los **dieciocho años**.\n- **Art. 13**: los extranjeros gozan de las libertades públicas del Título I en los términos de los tratados y la ley. Solo los españoles son titulares de los derechos del **art. 23** (participación política), salvo reciprocidad para el sufragio en elecciones **municipales**. Se excluyen de la extradición los delitos políticos (no se consideran tales los actos de terrorismo)."},{"h":"Derechos fundamentales y libertades públicas (Sección 1.ª)","t":"- **Art. 14**: igualdad ante la ley; no discriminación por nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social.\n- **Art. 15**: derecho a la vida y a la integridad física y moral; abolición de la pena de muerte salvo lo que dispongan las leyes penales militares para tiempos de guerra.\n- **Art. 16**: libertad ideológica, religiosa y de culto. Nadie puede ser obligado a declarar sobre su ideología, religión o creencias.\n- **Art. 17**: libertad y seguridad. La detención preventiva no puede durar más del tiempo estrictamente necesario y, en todo caso, **setenta y dos horas**, plazo en el que el detenido debe ser puesto en libertad o a disposición de la autoridad judicial. Derecho de **habeas corpus**.\n- **Art. 18**: honor, intimidad y propia imagen; inviolabilidad del domicilio; secreto de las comunicaciones; limitación del uso de la informática.\n- **Art. 19**: libertad de residencia y circulación. **Art. 20**: libertad de expresión, información, cátedra y producción artística; no puede restringirse mediante censura previa. **Art. 21**: reunión pacífica y sin armas. **Art. 22**: asociación. **Art. 23**: participación en asuntos públicos y acceso a funciones y cargos públicos **en condiciones de igualdad, con los requisitos que señalen las leyes**.\n- **Art. 24**: tutela judicial efectiva, juez ordinario predeterminado por la ley, defensa, presunción de inocencia. **Art. 25**: legalidad penal. **Art. 27**: derecho a la **educación** y libertad de enseñanza; se reconoce la **autonomía de las Universidades** en los términos que la ley establezca. **Art. 28**: sindicación y huelga. **Art. 29**: derecho de petición individual y colectiva, por escrito."},{"h":"Derechos y deberes de los ciudadanos (Sección 2.ª)","t":"- **Art. 30**: derecho y deber de defender a España; objeción de conciencia.\n- **Art. 31**: deber de contribuir al sostenimiento de los gastos públicos.\n- **Art. 32**: matrimonio en plena igualdad jurídica. **Art. 33**: propiedad privada y herencia. **Art. 34**: fundaciones. **Art. 35**: deber de trabajar y derecho al trabajo. **Art. 36**: colegios profesionales. **Art. 37**: negociación colectiva. **Art. 38**: libertad de empresa."},{"h":"Principios rectores y garantías (Capítulos III, IV y V)","t":"- **Capítulo III (arts. 39-52)**: protección de la familia, seguridad social, salud, cultura (**art. 44**), medio ambiente, vivienda, juventud, personas con discapacidad, tercera edad, consumidores. Solo se alegan ante la jurisdicción ordinaria **de acuerdo con las leyes que los desarrollen** (art. 53.3).\n- **Art. 53.1**: los derechos del Capítulo II **vinculan a todos los poderes públicos**; solo por **ley**, que respete su **contenido esencial**, puede regularse su ejercicio.\n- **Art. 53.2**: tutela ante los tribunales ordinarios por un procedimiento basado en los principios de **preferencia y sumariedad** y, en su caso, recurso de **amparo** ante el Tribunal Constitucional (para el art. 14, la Sección 1.ª y la objeción de conciencia del art. 30).\n- **Art. 54**: el **Defensor del Pueblo** es el alto comisionado de las Cortes Generales, designado por estas para la defensa de los derechos del Título I; regulado por ley orgánica.\n- **Art. 55**: los derechos de los arts. 17, 18.2 y 18.3, 19, 20.1.a) y d) y 20.5, 21, 28.2 y 37.2 pueden suspenderse con la declaración de los estados de excepción o de sitio."},{"h":"Título IV: el Gobierno y la Administración (arts. 97 a 107)","t":"- **Art. 97**: el Gobierno dirige la política interior y exterior, la Administración civil y militar y la defensa del Estado; ejerce la función ejecutiva y la **potestad reglamentaria**.\n- **Art. 98**: el Gobierno se compone del **Presidente, Vicepresidentes (en su caso), Ministros** y demás miembros que establezca la ley. El Presidente dirige la acción del Gobierno.\n- **Art. 99**: investidura. El Rey propone un candidato a través del Presidente del Congreso; si el Congreso otorga su confianza por **mayoría absoluta**, el Rey le nombra Presidente; si no, nueva votación a las **48 horas** y basta la **mayoría simple**.\n- **Art. 100**: los demás miembros del Gobierno son nombrados y separados por el **Rey, a propuesta del Presidente**.\n- **Art. 101**: el Gobierno cesa tras elecciones generales, pérdida de confianza parlamentaria, o dimisión o fallecimiento del Presidente; el cesante continúa en funciones.\n- **Art. 102**: la responsabilidad criminal del Presidente y los miembros del Gobierno es exigible ante la **Sala de lo Penal del Tribunal Supremo**.\n- **Art. 103**: la Administración Pública sirve con **objetividad** los intereses generales y actúa de acuerdo con los principios de **eficacia, jerarquía, descentralización, desconcentración y coordinación**, con sometimiento pleno a la **ley y al Derecho**. El acceso a la función pública se regula conforme a los principios de **mérito y capacidad**. La ley regulará el estatuto de los funcionarios, su derecho a sindicación, las incompatibilidades y las garantías de imparcialidad.\n- **Art. 104**: las Fuerzas y Cuerpos de seguridad, bajo la dependencia del Gobierno, protegen el libre ejercicio de los derechos y libertades y garantizan la seguridad ciudadana.\n- **Art. 105**: la ley regulará la **audiencia** de los ciudadanos en la elaboración de disposiciones administrativas, el **acceso a archivos y registros administrativos** (salvo seguridad y defensa del Estado, averiguación de delitos e intimidad) y el procedimiento administrativo.\n- **Art. 106**: los Tribunales controlan la potestad reglamentaria y la legalidad de la actuación administrativa; los particulares tienen derecho a ser **indemnizados** por las lesiones causadas por el funcionamiento de los servicios públicos, salvo fuerza mayor.\n- **Art. 107**: el **Consejo de Estado** es el supremo órgano consultivo del Gobierno."}],"clave":["Art. 1.1: libertad, justicia, igualdad y pluralismo político.","Art. 9.3: legalidad, jerarquía normativa, publicidad, irretroactividad, seguridad jurídica, responsabilidad, interdicción de la arbitrariedad.","Art. 17.2: detención preventiva máxima de 72 horas.","Art. 99: mayoría absoluta; a las 48 horas, mayoría simple.","Art. 103.1: eficacia, jerarquía, descentralización, desconcentración, coordinación.","Art. 103.3: acceso a la función pública por mérito y capacidad."],"preguntas":[{"q":"Según el artículo 1.1 de la Constitución, ¿cuál de los siguientes NO es un valor superior del ordenamiento jurídico?","o":["La libertad","La justicia","La solidaridad","El pluralismo político"],"c":2,"ref":["CE","1","la libertad, la justicia, la igualdad y el pluralismo político"],"e":"Los cuatro valores superiores son libertad, justicia, igualdad y pluralismo político. La solidaridad se cita en el art. 2, pero no como valor superior."},{"q":"La forma política del Estado español es:","o":["La República parlamentaria","La Monarquía parlamentaria","La Monarquía constitucional federal","La República presidencialista"],"c":1,"ref":["CE","1","la forma política del estado español es la monarquía parlamentaria"],"e":"Art. 1.3 CE."},{"q":"¿Qué lengua es la oficial del Estado según el artículo 3 de la Constitución?","o":["El castellano, que todos los españoles tienen el deber de conocer y el derecho a usar","El castellano y las lenguas cooficiales en todo el territorio","El castellano únicamente en las Administraciones del Estado","Ninguna, la Constitución no establece lengua oficial"],"c":0,"ref":["CE","3","todos los españoles tienen el deber de conocerla y el derecho a usarla"],"e":"Art. 3.1: el castellano es la lengua española oficial del Estado; todos tienen el deber de conocerla y el derecho a usarla. Las demás lenguas son oficiales en sus Comunidades Autónomas (art. 3.2)."},{"q":"¿Cuál es la capital del Estado según la Constitución?","o":["Madrid","Toledo","Barcelona","No la define"],"c":0,"ref":["CE","5","la capital del estado es la villa de madrid"],"e":"Art. 5 CE."},{"q":"Según el artículo 9.3 de la Constitución, ¿cuál de los siguientes principios garantiza?","o":["La irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales","La retroactividad de todas las leyes","La discrecionalidad de los poderes públicos","La inmunidad de los poderes públicos"],"c":0,"ref":["CE","9","la irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales"],"e":"Art. 9.3 CE. Junto a la legalidad, jerarquía normativa, publicidad, seguridad jurídica, responsabilidad e interdicción de la arbitrariedad."},{"q":"El artículo 10.2 de la Constitución establece que las normas sobre derechos fundamentales se interpretarán de conformidad con:","o":["La Declaración Universal de Derechos Humanos y los tratados internacionales ratificados por España","La jurisprudencia del Tribunal Supremo","Los Estatutos de Autonomía","El Código Civil"],"c":0,"ref":["CE","10","declaración universal de derechos humanos"],"e":"Art. 10.2 CE."},{"q":"¿A qué edad son mayores de edad los españoles según la Constitución?","o":["A los dieciséis años","A los dieciocho años","A los veintiún años","A los diecinueve años"],"c":1,"ref":["CE","12","los españoles son mayores de edad a los dieciocho años"],"e":"Art. 12 CE."},{"q":"Según el artículo 11.2 de la Constitución:","o":["Ningún español de origen podrá ser privado de su nacionalidad","Un español puede ser privado de su nacionalidad por sentencia firme","La nacionalidad se pierde al residir diez años en el extranjero","La nacionalidad solo se adquiere por nacimiento"],"c":0,"ref":["CE","11","ningún español de origen podrá ser privado de su nacionalidad"],"e":"Art. 11.2 CE."},{"q":"¿Cuál es la duración máxima de la detención preventiva según el artículo 17 de la Constitución?","o":["Veinticuatro horas","Cuarenta y ocho horas","Setenta y dos horas","Cinco días"],"c":2,"ref":["CE","17","setenta y dos horas"],"e":"Art. 17.2: el tiempo estrictamente necesario y, en todo caso, setenta y dos horas."},{"q":"El artículo 14 de la Constitución proclama:","o":["La igualdad de los españoles ante la ley, sin que pueda prevalecer discriminación alguna","El derecho a la vida y a la integridad física","La libertad ideológica","El derecho de reunión"],"c":0,"ref":["CE","14","los españoles son iguales ante la ley"],"e":"Art. 14 CE."},{"q":"¿Qué artículo de la Constitución reconoce la autonomía de las Universidades?","o":["El artículo 20","El artículo 27","El artículo 44","El artículo 103"],"c":1,"ref":["CE","27","se reconoce la autonomía de las universidades"],"e":"Art. 27.10 CE: «Se reconoce la autonomía de las Universidades, en los términos que la ley establezca»."},{"q":"Según el artículo 29 de la Constitución, el derecho de petición se ejerce:","o":["Individual y colectivamente, por escrito","Solo individualmente y por cualquier medio","Solo colectivamente","Verbalmente ante el Defensor del Pueblo"],"c":0,"ref":["CE","29","individual y colectiva, por escrito"],"e":"Art. 29.1 CE."},{"q":"El artículo 23.2 de la Constitución reconoce el derecho de los ciudadanos a acceder en condiciones de igualdad a las funciones y cargos públicos:","o":["Con los requisitos que señalen las leyes","Sin ningún requisito","Solo mediante elección","Solo si se tiene la nacionalidad de origen"],"c":0,"ref":["CE","23","con los requisitos que señalen las leyes"],"e":"Art. 23.2 CE."},{"q":"¿Dónde se encuentran regulados los principios rectores de la política social y económica?","o":["Capítulo II del Título I","Capítulo III del Título I","Capítulo IV del Título I","Título Preliminar"],"c":1,"ref":["CE","53","los principios reconocidos en el capítulo tercero"],"e":"Capítulo tercero del Título I, arts. 39 a 52."},{"q":"Según el artículo 53.1 de la Constitución, el ejercicio de los derechos y libertades del Capítulo segundo solo puede regularse:","o":["Por ley, que en todo caso deberá respetar su contenido esencial","Por reglamento del Gobierno","Por decreto-ley en todo caso","Por los Estatutos de Autonomía"],"c":0,"ref":["CE","53","que en todo caso deberá respetar su contenido esencial"],"e":"Art. 53.1 CE."},{"q":"El recurso de amparo ante el Tribunal Constitucional protege, según el artículo 53.2:","o":["El artículo 14, la Sección primera del Capítulo segundo y la objeción de conciencia del artículo 30","Todos los derechos del Título I","Solo los principios rectores","Solo los derechos de la Sección segunda"],"c":0,"ref":["CE","53","este último recurso será aplicable a la objeción de conciencia reconocida en el artículo 30"],"e":"Art. 53.2 CE."},{"q":"El Defensor del Pueblo es, según el artículo 54 de la Constitución:","o":["El alto comisionado de las Cortes Generales","Un órgano dependiente del Gobierno","Un órgano del Poder Judicial","Un comisionado del Consejo de Estado"],"c":0,"ref":["CE","54","alto comisionado de las cortes generales"],"e":"Art. 54 CE, regulado por ley orgánica."},{"q":"¿Quién nombra y separa a los Ministros según el artículo 100 de la Constitución?","o":["El Presidente del Gobierno","El Rey, a propuesta del Presidente del Gobierno","El Congreso de los Diputados","El Presidente del Congreso"],"c":1,"ref":["CE","100","nombrados y separados por el rey, a propuesta de su presidente"],"e":"Art. 100 CE."},{"q":"En la investidura, si el candidato no obtiene la mayoría absoluta, ¿cuándo se vota de nuevo y qué mayoría se exige?","o":["A las 48 horas, mayoría simple","A las 24 horas, mayoría absoluta","A los 7 días, mayoría simple","A las 72 horas, mayoría de tres quintos"],"c":0,"ref":["CE","99","cuarenta y ocho horas después de la anterior"],"e":"Art. 99.3 CE: nueva votación 48 horas después; basta mayoría simple."},{"q":"La responsabilidad criminal del Presidente y los miembros del Gobierno es exigible ante:","o":["El Tribunal Constitucional","La Sala de lo Penal del Tribunal Supremo","La Audiencia Nacional","El Congreso de los Diputados"],"c":1,"ref":["CE","102","sala de lo penal del tribunal supremo"],"e":"Art. 102.1 CE."},{"q":"¿Cuál de los siguientes NO es un principio de actuación de la Administración Pública según el artículo 103.1?","o":["Eficacia","Jerarquía","Competitividad","Desconcentración"],"c":2,"ref":["CE","103","eficacia, jerarquía, descentralización, desconcentración y coordinación"],"e":"Los principios son eficacia, jerarquía, descentralización, desconcentración y coordinación."},{"q":"El acceso a la función pública se regula, según el artículo 103.3, de acuerdo con los principios de:","o":["Mérito y capacidad","Antigüedad y experiencia","Libre designación y confianza","Igualdad y publicidad"],"c":0,"ref":["CE","103","los principios de mérito y capacidad"],"e":"Art. 103.3 CE."},{"q":"Según el artículo 105 de la Constitución, el acceso de los ciudadanos a los archivos y registros administrativos tiene como excepciones:","o":["La seguridad y defensa del Estado, la averiguación de los delitos y la intimidad de las personas","Solo la seguridad nacional","Los documentos con más de 50 años","Ninguna"],"c":0,"ref":["CE","105","la seguridad y defensa del estado, la averiguación de los delitos y la intimidad de las personas"],"e":"Art. 105.b CE."},{"q":"Según el artículo 106.2 de la Constitución, los particulares tienen derecho a ser indemnizados por las lesiones que sufran como consecuencia del funcionamiento de los servicios públicos:","o":["Salvo en los casos de fuerza mayor","Siempre, sin excepciones","Solo si hay dolo del funcionario","Solo si lo decide el Consejo de Estado"],"c":0,"ref":["CE","106","salvo en los casos de fuerza mayor"],"e":"Art. 106.2 CE."},{"q":"El supremo órgano consultivo del Gobierno es:","o":["El Consejo de Estado","El Consejo General del Poder Judicial","El Tribunal de Cuentas","El Defensor del Pueblo"],"c":0,"ref":["CE","107","supremo órgano consultivo del gobierno"],"e":"Art. 107 CE."}],"audio":"audio/g1-podcast.mp3"},"g2":{"id":"g2","num":2,"titulo":"Ley Orgánica del Sistema Universitario (LOSU)","alcance":"Ley Orgánica 2/2023, de 22 de marzo: Título Preliminar; Títulos I a IV; Título IX, capítulo I (arts. 1 a 13 y 38 a 43).","bloque":"General","fuentes":["BOE-A-2023-7500 (Ley Orgánica 2/2023, texto consolidado)"],"notas":["Estudia solo los artículos 1 a 13 y 38 a 43. El resto de la ley no entra en el programa.","La LOSU (Ley Orgánica 2/2023) sustituye a la antigua LOU de 2001. Si usas apuntes viejos, comprueba que hablan de la LOSU y no de la LOU.","Se repiten mucho el art. 3 (autonomía), el art. 38.4 (qué órganos agotan la vía administrativa) y el art. 12 (Ciencia Abierta y repositorios, que conecta con Digibug)."],"apuntes":[{"h":"Objeto y concepto (art. 1)","t":"- Regula el **sistema universitario** y los mecanismos de **coordinación, cooperación y colaboración** entre las Administraciones con competencias universitarias.\n- **Sistema universitario**: el conjunto de universidades, públicas y privadas, y de los centros y estructuras que les sirven para el desarrollo de sus funciones.\n- **Universidades**: instituciones públicas o privadas que desarrollan las funciones centrales de **docencia, investigación y transferencia e intercambio del conocimiento** y ofertan títulos oficiales de **Grado, Máster Universitario y Doctorado** en la mayoría de ramas de conocimiento."},{"h":"Título I: funciones y autonomía (arts. 2 y 3)","t":"- **Art. 2.1**: el sistema universitario presta y garantiza el **servicio público de la educación superior universitaria** mediante la docencia, la investigación y la transferencia del conocimiento.\n- **Art. 2.2**: funciones de las universidades (educación y formación; preparación profesional; generación y transferencia del conocimiento; innovación; bienestar social y progreso económico; espacios de pensamiento crítico; formación de la ciudadanía en valores democráticos; fomento del voluntariado y del tercer sector).\n- **Art. 2.3**: referentes: derechos humanos, memoria democrática, equidad e igualdad, sostenibilidad, lucha contra el cambio climático y los Objetivos de Desarrollo Sostenible.\n- **Art. 3.1**: las universidades tienen **personalidad jurídica** y actúan con **autonomía** en virtud del derecho fundamental del **art. 27.10 de la Constitución**.\n- **Art. 3.2**: la autonomía comprende, entre otras cosas, elaborar sus **Estatutos**, determinar su organización y estructuras, elegir y remover a sus órganos de gobierno, la autonomía económica y financiera, aprobar planes de estudio, expedir títulos, seleccionar y promover a su personal (PDI y PTGAS), establecer sus **relaciones de puestos de trabajo**, admitir al estudiantado y definir sistemas internos de garantía de calidad.\n- **Art. 3.3**: la autonomía garantiza la **libertad de cátedra** (docencia, investigación y estudio).\n- **Art. 3.5**: las universidades deben **rendir cuentas** a la sociedad, gestionar con transparencia y ofrecer un servicio público de calidad."},{"h":"Título II: creación y calidad (arts. 4 y 5)","t":"- **Art. 4.1**: las universidades públicas se crean (y las privadas se reconocen) **por ley de la Asamblea Legislativa de la Comunidad Autónoma**, previo informe preceptivo de la **Conferencia General de Política Universitaria**; o por ley de las **Cortes Generales** si son de especiales características.\n- **Art. 4.2**: el Gobierno, por **real decreto**, fija las condiciones básicas; la **Comunidad Autónoma** autoriza el inicio de actividades y supervisa su cumplimiento.\n- **Art. 4.3**: requisito de creación: planes de **igualdad de género**, medidas contra la brecha salarial, **accesibilidad** y ajustes razonables y medidas contra la violencia, discriminación o acoso (Ley 3/2022 de convivencia universitaria).\n- **Art. 5**: buen gobierno y calidad conforme a los estándares del **Espacio Europeo de Educación Superior**. La calidad es responsabilidad compartida de universidades, agencias de evaluación y Administraciones. Acreditación y evaluación: **ANECA** y agencias autonómicas inscritas en **EQAR**."},{"h":"Título III: organización de enseñanzas (arts. 6 a 10)","t":"- **Art. 6**: la **docencia** es función fundamental; es un derecho y un deber del PDI; preferentemente **presencial**, puede ser virtual o híbrida. Participación efectiva del estudiantado en planes de estudio. Docencia oficial (Grado, Máster, Doctorado) y títulos propios.\n- **Art. 7**: títulos **oficiales** (validez en todo el Estado) y **propios**. Los oficiales se inscriben en el **Registro de Universidades, Centros y Títulos**, con efectos **constitutivos**. Se prevén microcredenciales.\n- **Art. 8**: los títulos oficiales los expide, **en nombre del Rey**, el **Rector o Rectora**. Para impartir una enseñanza oficial: informe de la Comunidad Autónoma, informe de la agencia de calidad, verificación del **Consejo de Universidades** y autorización de la Comunidad Autónoma.\n- **Art. 9**: tres ciclos: **Grado** (formación básica y generalista), **Máster Universitario** (formación avanzada y especializada) y **Doctorado** (competencias de investigación).\n- **Art. 10**: el Gobierno regula convalidaciones, **homologación** y **equivalencia** de títulos extranjeros y reconocimiento de la experiencia laboral."},{"h":"Título IV: investigación (arts. 11 a 13)","t":"- **Art. 11**: la **investigación** es función fundamental; derecho y deber del PDI.\n- **Art. 12**: el conocimiento científico es un **bien común**; **Ciencia Abierta**: acceso abierto a publicaciones, datos, códigos y metodologías. El PDI debe depositar la versión final aceptada y sus datos en **repositorios institucionales o temáticos de acceso abierto**, simultáneamente a la publicación. (Conecta con **Digibug**.)\n- **Art. 13**: las Administraciones fomentan la investigación y el desarrollo tecnológico universitarios."},{"h":"Título IX, capítulo I: universidades públicas (arts. 38 a 43)","t":"- **Art. 38.1**: las universidades públicas se rigen por la **LOSU**, la **ley de su creación** y sus **Estatutos**, elaborados por ellas y **aprobados, previo control de legalidad, por la Comunidad Autónoma**. Plazo de la Comunidad para el informe de legalidad: **cuatro meses** (art. 38.2). Los Estatutos se publican en el diario oficial de la Comunidad y en el **BOE**.\n- **Art. 38.4**: las resoluciones del **Rector o Rectora** y los acuerdos del **Consejo Social, Consejo de Gobierno y Claustro** **ponen fin a la vía administrativa**.\n- **Art. 39**: rendición de cuentas y transparencia; las universidades deben tener un **portal de transparencia**.\n- **Art. 40**: estructura posible según los Estatutos: **campus, facultades, escuelas, departamentos, institutos universitarios de investigación, escuelas de doctorado** y otros centros.\n- **Art. 41**: facultades y escuelas se crean, modifican y suprimen por **acuerdo de la Comunidad Autónoma**, a iniciativa de la universidad (propuesta y aprobación de su Consejo de Gobierno). Departamentos, institutos, escuelas de doctorado y otros centros: **la propia universidad**.\n- **Art. 42**: la **adscripción** de centros docentes requiere convenio con la universidad y aprobación de la Comunidad Autónoma; un centro solo puede adscribirse a **una única universidad** (salvo excepción).\n- **Art. 43**: toda universidad contará con **unidades de igualdad y de diversidad**, **defensoría universitaria**, **inspección de servicios**, servicios de salud y acompañamiento psicológico y pedagógico y orientación profesional."}],"clave":["Art. 3.1: autonomía universitaria = derecho fundamental del art. 27.10 CE.","Art. 4.1: universidades públicas se crean por ley de la Asamblea de la Comunidad Autónoma.","Art. 8.1: el Rector expide los títulos en nombre del Rey.","Art. 9.1: tres ciclos: Grado, Máster y Doctorado.","Art. 38.2: cuatro meses para el informe de legalidad de los Estatutos.","Art. 38.4: Rector, Consejo Social, Consejo de Gobierno y Claustro agotan la vía administrativa."],"preguntas":[{"q":"Según el artículo 1 de la LOSU, ¿cuáles son las funciones centrales de las universidades?","o":["Docencia, investigación y transferencia e intercambio del conocimiento","Docencia, gestión y extensión universitaria","Investigación, publicación y cooperación internacional","Docencia, tutoría y evaluación"],"c":0,"ref":["LOSU","1","docencia, investigación y transferencia e intercambio del conocimiento"],"e":"Art. 1.2 LOSU."},{"q":"El sistema universitario presta y garantiza, según el artículo 2.1 de la LOSU:","o":["El servicio público de la educación superior universitaria","La educación obligatoria y gratuita","La investigación pública exclusivamente","La formación profesional de grado superior"],"c":0,"ref":["LOSU","2","el servicio público de la educación superior universitaria"],"e":"Art. 2.1 LOSU."},{"q":"La autonomía de las universidades se reconoce, según el artículo 3.1 de la LOSU, en virtud del derecho fundamental recogido en:","o":["El artículo 27.10 de la Constitución","El artículo 20 de la Constitución","El artículo 44 de la Constitución","El artículo 103 de la Constitución"],"c":0,"ref":["LOSU","3","el derecho fundamental reconocido en el artículo 27.10 de la constitución española"],"e":"Art. 3.1 LOSU."},{"q":"Según el artículo 3.3 de la LOSU, la autonomía universitaria garantiza:","o":["La libertad de cátedra del profesorado","La inamovilidad del personal","La exención de todo control financiero","La gratuidad de la matrícula"],"c":0,"ref":["LOSU","3","la autonomía universitaria garantiza la libertad de cátedra del profesorado"],"e":"Art. 3.3 LOSU: libertad en la docencia, la investigación y el estudio."},{"q":"¿Cuál de las siguientes competencias NO forma parte de la autonomía universitaria según el artículo 3.2 de la LOSU?","o":["La elaboración de sus Estatutos","El establecimiento de sus relaciones de puestos de trabajo o plantillas","La aprobación del presupuesto general del Estado","La expedición de los títulos correspondientes a las enseñanzas oficiales"],"c":2,"ref":["LOSU","3","el establecimiento de sus relaciones de puestos de trabajo o plantillas"],"e":"El presupuesto general del Estado lo aprueban las Cortes Generales; no es competencia universitaria."},{"q":"Según el artículo 3.5 de la LOSU, en el ejercicio de su autonomía las universidades deberán:","o":["Rendir cuentas a la sociedad del uso de sus medios y recursos","Obtener autorización previa del Gobierno para cada gasto","Someterse a la dirección del Consejo de Universidades","Delegar su gestión financiera en la Comunidad Autónoma"],"c":0,"ref":["LOSU","3","rendir cuentas a la sociedad del uso de sus medios y recursos humanos, materiales y económicos"],"e":"Art. 3.5 LOSU."},{"q":"¿Cómo se crean las universidades públicas según el artículo 4.1.a) de la LOSU?","o":["Por ley de la Asamblea Legislativa de la Comunidad Autónoma, previo informe preceptivo de la Conferencia General de Política Universitaria","Por real decreto del Consejo de Ministros","Por resolución del Rector de la universidad matriz","Por orden del Ministerio de Universidades"],"c":0,"ref":["LOSU","4","por ley de la asamblea legislativa de la comunidad autónoma"],"e":"Art. 4.1.a) LOSU."},{"q":"Según el artículo 4.2 de la LOSU, ¿a quién corresponde autorizar el inicio de actividades de una universidad?","o":["A los órganos competentes de la Comunidad Autónoma en la que radique la universidad","Al Consejo de Ministros","A la ANECA","A la Conferencia General de Política Universitaria"],"c":0,"ref":["LOSU","4","corresponde a los órganos competentes de la comunidad autónoma en la que radique la universidad otorgar la autorización para el inicio de sus actividades"],"e":"Art. 4.2 LOSU."},{"q":"¿Qué agencia es competente, junto a las autonómicas inscritas en EQAR, para la acreditación y evaluación del profesorado universitario según el artículo 5.4?","o":["ANECA","CRUE","REBIUN","CNMC"],"c":0,"ref":["LOSU","5","agencia nacional de evaluación de la calidad y acreditación"],"e":"Art. 5.4 LOSU: ANECA."},{"q":"Según el artículo 6.1 de la LOSU, la docencia universitaria, preferentemente presencial:","o":["Podrá impartirse también de manera virtual o híbrida","Debe ser siempre presencial","Solo puede ser virtual en las universidades privadas","No puede ser híbrida"],"c":0,"ref":["LOSU","6","podrá impartirse también de manera virtual o híbrida"],"e":"Art. 6.1 LOSU."},{"q":"Los títulos universitarios oficiales deben inscribirse, según el artículo 7.3 de la LOSU, en:","o":["El Registro de Universidades, Centros y Títulos","El Registro Civil","El Registro Mercantil","El Registro General de la Propiedad Intelectual"],"c":0,"ref":["LOSU","7","registro de universidades, centros y títulos"],"e":"Art. 7.3 LOSU. La inscripción tiene efectos constitutivos."},{"q":"¿Quién expide los títulos universitarios oficiales según el artículo 8.1 de la LOSU?","o":["El Rector o Rectora de la universidad, en nombre del Rey","El Ministro de Universidades","El Consejo de Universidades","El Decano de la facultad"],"c":0,"ref":["LOSU","8","serán expedidos, en nombre del rey, por el rector o rectora de la universidad"],"e":"Art. 8.1 LOSU."},{"q":"Las enseñanzas universitarias oficiales se estructuran en tres ciclos:","o":["Grado, Máster Universitario y Doctorado","Diplomatura, Licenciatura y Doctorado","Grado, Posgrado y Especialización","Bachiller, Grado y Máster"],"c":0,"ref":["LOSU","9","se estructuran en tres ciclos: grado, máster universitario y doctorado"],"e":"Art. 9.1 LOSU."},{"q":"Según el artículo 9.3 de la LOSU, los estudios de Máster Universitario tienen como objetivo:","o":["La formación avanzada, especializada, multidisciplinar o interdisciplinar, orientada a la especialización académica o profesional o a la iniciación en tareas de investigación","Una formación básica y generalista en una disciplina","La adquisición de competencias de investigación en un ámbito del conocimiento","La formación permanente a lo largo de la vida"],"c":0,"ref":["LOSU","9","formación avanzada, de carácter especializado temáticamente"],"e":"Art. 9.3 LOSU. La formación básica y generalista corresponde al Grado (art. 9.2) y la investigación al Doctorado (art. 9.4)."},{"q":"El artículo 12 de la LOSU establece que el personal docente e investigador deberá depositar una copia de la versión final aceptada para publicación y los datos asociados en:","o":["Repositorios institucionales o temáticos de acceso abierto","Bases de datos comerciales de las editoriales","El Registro de Universidades, Centros y Títulos","El archivo histórico universitario"],"c":0,"ref":["LOSU","12","repositorios institucionales o temáticos de acceso abierto"],"e":"Art. 12.2 LOSU (Ciencia Abierta)."},{"q":"Según el artículo 12.1 de la LOSU, el conocimiento científico tendrá la consideración de:","o":["Un bien común","Un bien patrimonial de la universidad","Un secreto industrial","Un servicio comercial"],"c":0,"ref":["LOSU","12","el conocimiento científico tendrá la consideración de un bien común"],"e":"Art. 12.1 LOSU."},{"q":"Las universidades públicas se rigen, según el artículo 38.1 de la LOSU, por:","o":["La LOSU, la ley de su creación y sus Estatutos, entre otras normas","Exclusivamente por sus Estatutos","Únicamente por la normativa autonómica","Por la Ley de Contratos del Sector Público exclusivamente"],"c":0,"ref":["LOSU","38","por esta ley orgánica, por la ley de su creación y por sus estatutos"],"e":"Art. 38.1 LOSU."},{"q":"¿De cuánto tiempo dispone la Comunidad Autónoma para elaborar el informe de legalidad de los Estatutos (art. 38.2 LOSU)?","o":["Un mes","Dos meses","Cuatro meses","Seis meses"],"c":2,"ref":["LOSU","38","un plazo de cuatro meses para la elaboración del informe de legalidad"],"e":"Art. 38.2 LOSU."},{"q":"Según el artículo 38.4 de la LOSU, ponen fin a la vía administrativa:","o":["Las resoluciones del Rector o Rectora y los acuerdos del Consejo Social, del Consejo de Gobierno y del Claustro Universitario","Solo las resoluciones del Rector","Las resoluciones de los Decanos","Los acuerdos de los departamentos"],"c":0,"ref":["LOSU","38","ponen fin a la vía administrativa"],"e":"Art. 38.4 LOSU."},{"q":"El artículo 39.3 de la LOSU obliga a las universidades a contar con:","o":["Un portal de transparencia","Una radiotelevisión propia","Una escuela de doctorado en cada campus","Un servicio jurídico externo"],"c":0,"ref":["LOSU","39","deberán contar con un portal de transparencia"],"e":"Art. 39.3 LOSU."},{"q":"Según el artículo 41 de la LOSU, la creación, modificación y supresión de facultades y escuelas será acordada por:","o":["La Comunidad Autónoma, a iniciativa de la universidad mediante propuesta y aprobación de su Consejo de Gobierno","El Rector por sí solo","El Consejo Social","El Ministerio de Universidades"],"c":0,"ref":["LOSU","41","serán acordadas por la comunidad autónoma, a iniciativa de la universidad"],"e":"Art. 41.1 LOSU. Los departamentos, institutos y escuelas de doctorado los crea la propia universidad (art. 41.2)."},{"q":"Según el artículo 42.3 de la LOSU, un centro adscrito solo podrá adscribirse:","o":["A una única universidad, salvo dispensa excepcional","A tantas universidades como convenios firme","A dos universidades como máximo","Solo a universidades privadas"],"c":0,"ref":["LOSU","42","sólo podrán adscribirse a una única universidad"],"e":"Art. 42.3 LOSU."},{"q":"¿Cuál de los siguientes servicios o unidades debe tener toda universidad según el artículo 43.1 de la LOSU?","o":["Defensoría universitaria","Un observatorio astronómico","Una editorial propia","Un hospital universitario"],"c":0,"ref":["LOSU","43","defensoría universitaria"],"e":"Art. 43.1 LOSU: unidades de igualdad y de diversidad, defensoría universitaria, inspección de servicios, servicios de salud y orientación profesional."}],"audio":"audio/g2-podcast.mp3"}},"orden":["g1","g2"],"bloqueados":[{"id":"g3","bloque":"General","num":3,"titulo":"Proyecto de Estatutos de la Universidad de Granada","alcance":"Claustro de 25 de mayo de 2026","n":26,"muestra":[{"q":"Según el artículo 1 del Proyecto de Estatutos, la Universidad de Granada es:","o":["Una institución de derecho público, con personalidad jurídica y patrimonio propio","Una fundación pública sin patrimonio propio","Un organismo autónomo de la Junta de Andalucía","Una sociedad mercantil estatal"],"c":0,"ref":["ESTATUTOS","1","institución de derecho público, con personalidad jurídica y patrimonio propio"],"e":"Art. 1.1 del Proyecto de Estatutos."},{"q":"El Claustro Universitario es, según el artículo 61:","o":["El máximo órgano de representación y participación de la comunidad universitaria","El máximo órgano de gobierno de la Universidad","El órgano de representación de la sociedad","El órgano de gestión económica"],"c":0,"ref":["ESTATUTOS","61","máximo órgano de representación y participación de la comunidad universitaria"],"e":"Art. 61. El máximo órgano de gobierno es el Consejo de Gobierno (art. 66)."},{"q":"El Consejo de Gobierno está compuesto, además de por los miembros natos, por cincuenta miembros, de los cuales:","o":["Cuarenta y siete son de la comunidad universitaria y tres externos a la Universidad","Cuarenta son de la comunidad universitaria y diez externos","Todos pertenecen a la comunidad universitaria","Treinta y cinco son de la comunidad universitaria y quince externos"],"c":0,"ref":["ESTATUTOS","67","cuarenta y siete serán miembros de la comunidad universitaria y tres externos a la universidad"],"e":"Art. 67.1 del Proyecto de Estatutos."},{"q":"Según el artículo 84, el o la Gerente es el responsable de:","o":["La gestión de los servicios administrativos y económicos y de los recursos humanos de la Universidad","La docencia y la investigación","La fe pública de los acuerdos de los órganos de gobierno","La representación legal de la Universidad"],"c":0,"ref":["ESTATUTOS","84","gestión de los servicios administrativos y económicos, así como de los recursos humanos"],"e":"Art. 84.1 del Proyecto de Estatutos."},{"q":"El sistema de archivos que forma el Archivo Universitario está integrado por:","o":["Los Archivos de Gestión, el Archivo Intermedio y el Archivo Histórico","El Archivo Central y el Archivo Provincial","Solo el Archivo Histórico","Los archivos de cada Facultad exclusivamente"],"c":0,"ref":["ESTATUTOS","246","archivos de gestión de la universidad y sus distintas estructuras, el archivo intermedio y el archivo histórico"],"e":"Art. 246.1 del Proyecto de Estatutos, más el archivo electrónico único."}]},{"id":"g4","bloque":"General","num":4,"titulo":"Empleo público: EBEP y Ley de la Función Pública de Andalucía","alcance":"TREBEP Títulos I y II; Ley 5/2023 Títulos I (caps. I y 3), IX, XI y XII","n":32,"muestra":[{"q":"Según el artículo 2.1 del EBEP, el Estatuto se aplica al personal de las siguientes Administraciones. ¿Cuál de ellas incluye expresamente?","o":["Las Universidades Públicas","Solo la Administración General del Estado","Solo las entidades locales","Las universidades privadas"],"c":0,"ref":["EBEP","2","las universidades públicas"],"e":"Art. 2.1.e EBEP."},{"q":"Según el artículo 11.1 del EBEP, el personal laboral presta servicios en virtud de:","o":["Un contrato de trabajo formalizado por escrito","Un nombramiento legal","Un acuerdo verbal con el órgano de contratación","Una orden de servicio"],"c":0,"ref":["EBEP","11","contrato de trabajo formalizado por escrito"],"e":"Art. 11.1 EBEP. Fijo, por tiempo indefinido o temporal según su duración."},{"q":"El personal eventual realiza, según el artículo 17 de la Ley 5/2023, solo funciones:","o":["De confianza o asesoramiento especial","De ejecución de programas temporales","De sustitución de titulares","De carácter permanente y técnico"],"c":0,"ref":["LFPA","17","funciones de confianza o asesoramiento especial"],"e":"Art. 17.1 de la Ley 5/2023."},{"q":"Según el artículo 120.1 de la Ley 5/2023, la prolongación de la permanencia en el servicio activo tiene como límite máximo el cumplimiento de:","o":["Setenta años","Sesenta y siete años","Sesenta y cinco años","Setenta y dos años"],"c":0,"ref":["LFPA","120","límite máximo del cumplimiento de la edad de setenta años"],"e":"Art. 120.1: por períodos de un año renovables."},{"q":"El traslado forzoso, como sanción por faltas muy graves, podrá imponerse según el artículo 171.1.b) de la Ley 5/2023 por un período máximo de:","o":["Un año","Seis meses","Tres años","Cinco años"],"c":0,"ref":["LFPA","171","por un período máximo de un año"],"e":"Art. 171.1.b de la Ley 5/2023."}]},{"id":"g5","bloque":"General","num":5,"titulo":"Prevención de Riesgos Laborales","alcance":"Ley 31/1995","n":28,"muestra":[{"q":"Según el artículo 2.1 de la Ley 31/1995, ¿cuál es el objeto de la ley?","o":["Promover la seguridad y la salud de los trabajadores mediante la prevención de los riesgos derivados del trabajo","Regular las prestaciones por accidente de trabajo","Fijar el salario mínimo de los trabajadores expuestos a riesgo","Establecer las sanciones a los trabajadores negligentes"],"c":0,"ref":["LPRL","2","promover la seguridad y la salud de los trabajadores"],"e":"Art. 2.1 LPRL."},{"q":"Según el artículo 14.1 de la LPRL, el deber de protección de los trabajadores frente a los riesgos laborales constituye también un deber:","o":["De las Administraciones públicas respecto del personal a su servicio","Exclusivo de la Inspección de Trabajo","De los sindicatos más representativos","Únicamente de los servicios de prevención ajenos"],"c":0,"ref":["LPRL","14","este deber de protección constituye, igualmente, un deber de las administraciones públicas respecto del personal a su servicio"],"e":"Art. 14.1 LPRL."},{"q":"Si el empresario no adopta las medidas necesarias ante un riesgo grave e inminente, los representantes legales de los trabajadores podrán acordar la paralización de la actividad:","o":["Por mayoría de sus miembros","Por unanimidad de sus miembros","Por decisión del Delegado de Prevención más antiguo","Previa autorización judicial"],"c":0,"ref":["LPRL","21","por mayoría de sus miembros, la paralización de la actividad"],"e":"Art. 21.3 LPRL."},{"q":"Los Delegados de Prevención son, según el artículo 35 n proporción.","Consecuencia práctica: como cada fallo solo resta 0,25, conviene contestar cuando puedas descartar al menos una opción. Si no tienes ni idea, déjala en blanco."],"enlaces":[{"t":"Convocatoria en el BOE","u":"https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-20786"},{"t":"Página del proceso en el Servicio de PTGAS de la UGR","u":"https://serviciopas.ugr.es/acceso-empleo-publico/30-09-2026-e-aux-bibli"},{"t":"Sede electrónica de la UGR","u":"https://sede.ugr.es"},{"t":"Exámenes anteriores de la escala (Transparencia)","u":"https://serviciopas.ugr.es/informacion/transparencia-proteccion-datos/transparencia/auxiliares-bibliotecas"},{"t":"Proyecto de Estatutos de la UGR","u":"https://secretariageneral.ugr.es/informacion/presentacion/reforma-estatutos-ugr/proyecto-estatutos"}],"importante":["Este resumen es orientativo. Manda siempre el texto de la convocatoria en el BOE y la página oficial del proceso.","Estudia siempre con las versiones vigentes a 6 de octubre de 2026 (lo exige la convocatoria). La excepción son los Estatutos de la UGR: se estudia el documento aprobado por el Claustro en mayo de 2026.","El programa de 2026 no es el de convocatorias anteriores. No te fíes de apuntes antiguos sin comprobar que coinciden con el programa del Anexo I.","Cada pregunta de esta web indica el artículo de donde sale. Si una respuesta te sorprende, abre el texto oficial y léelo: así se fija mejor.","Cada fallo resta 0,25 aciertos y las preguntas en blanco no restan. Contesta si puedes descartar al menos una opción."],"acciones":[{"id":"c1","t":"Guarda el justificante de tu solicitud y el del pago de la tasa","d":"Un PDF de cada uno en el móvil y otra copia en el correo."},{"id":"c3","t":"Comprueba que entras en la sede electrónica de la UGR","d":"Las notificaciones son electrónicas. Entra en sede.ugr.es con Cl@ve o certificado y revisa que funciona."},{"id":"c4","t":"Mira cada semana la web del proceso","d":"Ahí se publicarán la lista provisional de admitidos y l   for(const l of L){if(/^- /.test(l)){if(!ul){h+='<ul>';ul=true}h+='<li>'+inl(l.slice(2))+'</li>'}else{if(ul){h+='</ul>';ul=false}if(l.trim())h+='<p>'+inl(l)+'</p>'}}
  return h+(ul?'</ul>':'')}
function mezcla(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pct=(ok,ko,n)=>Math.max(0,Math.round((ok-ko/PEN)/n*100));
const mejor=id=>{const t=S.tests[id]||[];return t.length?Math.max(...t.map(x=>x.pct)):null};

/* ---------- Estudio: progreso, plan y racha ---------- */
const TEMARIO=DATOS.temario, PROC=DATOS.proceso, UMBRAL=75;
const MODOS={sim:'Simulacro',fallos:'Repaso de fallos',general:'Test del bloque general'};
const hoyStr=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pf=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const dd=(a,b)=>Math.round((b-a)/864e5);
const fmt=(d,o={weekday:'short',day:'numeric',month:'short'})=>d.toLocaleDateString('es-ES',o);
const letra=t=>t.bloque==='General'?'G':'E';
const disp=id=>!!TEMAS[id]||(ACC===true&&esBloq(id));   // contenido al que el usuario tiene acceso (abierto o de pago desbloqueado)
function marcar(){const h=hoyStr();S.act[h]=(S.act[h]||0)+1}
function testsDe(id){return (S.tests[id]||[]).filter(t=>!t.m)}   // sin las muestras gratuitas
function dominio(id){const ts=testsDe(id).slice(-3);if(!ts.length)return null;return ts.reduce((a,t)=>a+t.pct,0)/ts.length}
function progresoTema(id){if(!disp(id))return 0;const m=dominio(id);return .25*(S.leidos[id]?1:0)+.75*(m==null?0:Math.min(1,Math.max(0,m)/UMBRAL))}
function estadoTema(id){if(!disp(id))return['bloqueado',''];const m=dominio(id);
  if(m!=null&&m>=UMBRAL&&testsDe(id).length>=2)return['dominado','ok'];
  if(m!=null&&m<60)return['refuerzo','bad'];
  if(S.leidos[id]||m!=null)return['en curso','warn'];return['sin empezar','']}
function progresoTotal(bloque){const ts=TEMARIO.filter(t=>!bloque||t.bloque===bloque);const W=ts.reduce((a,t)=>a+t.dias,0);
  return ts.reduce((a,t)=>a+t.dias*progresoTema(t.id),0)/W}
function racha(){let n=0,d=new Date();if(!S.act[hoyStr(d)])d.setDate(d.getDate()-1);while(S.act[hoyStr(d)]){n++;d.setDate(d.getDate()-1)}return n}
const inicioPlan=()=>S.inicio||hoyStr();
const libre=d=>(S.sinSab&&d.getDay()===6)||(S.sinDom&&d.getDay()===0);   // dias que el usuario no quiere contar
function plan(){const ini=pf(inicioPlan()),ex=pf(S.examDate);let util=0;for(let d=new Date(ini);d<ex;d.setDate(d.getDate()+1))if(!libre(d))util++;
  const total=Math.max(30,util);
  const fin=Math.min(14,Math.round(total*.11));const aprender=total-fin;
  const hechos=new Set(S.hechos||[]),pend=TEMARIO.filter(t=>!hechos.has(t.id)),A=pend.length?pend:TEMARIO;   // temas dominados al rehacer: solo entran en el repaso
  const Wt=TEMARIO.reduce((a,t)=>a+t.dias,0),W1=A.reduce((a,t)=>a+t.dias,0);
  const p1=Math.min(aprender,Math.max(A.length,Math.round(aprender*.7*W1/Wt)));const out=[];
  const reparte=(desde,dias,fase,tarea,L=TEMARIO)=>{const W=L.reduce((a,t)=>a+t.dias,0);let cum=0,prev=0;L.forEach(t=>{cum+=t.dias;const hasta=Math.round(cum/W*dias);const n=hasta-prev;for(let k=1;k<=n;k++)out.push({i:desde+prev+k-1,fase,t,k,n,tarea:tarea(k,n)});prev=hasta})};
  reparte(0,p1,'Primera vuelta',(k,n)=>n===1?'Apuntes y test del tema':k===1?'Lee los apuntes del tema':k===n?'Test del tema y repaso de fallos (objetivo 75 %)':'Segunda lectura y test parcial',A);
  reparte(p1,aprender-p1,'Segunda vuelta',(k,n)=>k===n?'Test final del tema':'Test del tema y repaso de fallos');
  for(let k=0;k<fin;k++)out.push({i:aprender+k,fase:'Simulacros y repaso final',t:null,tarea:k%3===2?'Repaso de fallos y descanso mental':'Simulacro completo con cronómetro'});
  const fechas=[];for(let d=new Date(ini);fechas.length<out.length;d.setDate(d.getDate()+1))if(!libre(d))fechas.push(new Date(d));
  return out.map((e,k)=>({...e,fecha:fechas[k]}))}
function entradaHoy(){const P=plan(),h=hoyStr();return P.find(e=>hoyStr(e.fecha)>=h)||P[P.length-1]}   // si hoy es dia libre, la siguiente jornada
function diasTxt(){const d=dd(pf(hoyStr()),pf(S.examDate));return d>0?`faltan ${d} d`:'¡examen!'}
function barra(p,cls=''){const v=Math.round(Math.max(0,Math.min(1,p))*100);return `<div class="bar ${cls}" role="progressbar" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100"><b style="width:${v}%"></b></div>`}
function anillo(p,etq){const r=56,c=2*Math.PI*r;return `<div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="12"/><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg><b>${Math.round(p*100)}%<small>${etq}</small></b></div>`}

    body:JSON.stringify({oposicion:o.id,nombre:o.nombre+' ('+o.organismo+')',email:t?undefined:email})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.error||String(r.status)),{status:r.status,code:j.error});

  <input type="date" id="fex" value="${esc(S.examDate)}" min="${hoyStr()}"></label>
  <div class="row"><label for="fini"><b>Empezar el</b></label><input type="date" id="fini" value="${hoyStr()}" min="${hoyStr()}"><button type="button" class="btn ghost sm" id="rehacer">Rehacer el plan</button></div>

    <label class="row" style="gap:6px"><input type="checkbox" id="nodom" ${S.sinDom?'checked':''}> No contar domingos</label></div>
  <p class="muted" style="font-size:.85rem">${hoyStr()<inicioPlan()?'El plan empieza':'Empezaste'} el ${esc(fmt(pf(inicioPlan()),{day:'numeric',month:'long'}))}. Al rehacerlo, los temas que ya tienes dominados no se repiten en la primera vuelta: se reparte solo entre los que te faltan y los dominados entran en el repaso.${(S.hechos||[]).length?` Dominados al rehacer: ${S.hechos.map(i=>{const t=TEMARIO.find(x=>x.id===i);return t?letra(t)+t.num:''}).join(', ')}.`:''} Los días que no cuentes no aparecen en el calendario.</p></section>
  <section class="week" style="gap:12px">${html}</section>`;

    S.hechos=TEMARIO.filter(t=>estadoTema(t.id)[0]==='dominado').map(t=>t.id);marcar();guardar();toast('Plan recalculado desde el '+fmt(pf(S.inicio),{day:'numeric',month:'long'}));render()};
