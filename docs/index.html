async function entrar(email,pass){ponSesion(await api('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password:pass}}))}
async function recuperar(email){await api('/auth/v1/recover?redirect_to='+redir(),{method:'POST',body:{email}})}
async function nuevaClave(pass){await api('/auth/v1/user',{method:'PUT',token:await tokenValido(),body:{password:pass}})}
async function salir(){const t=SES&&SES.at;SES=null;guardaSes();nube='local';ACC=null;ACCHASTA=null;for(const k in FULL)delete FULL[k];
  if(t){try{await api('/auth/v1/logout',{method:'POST',token:t})}catch(e){}}pintaCuenta()}
function msgError(e){const c=e.code||'';
  if(c==='invalid_credentials')return'Correo o contraseña incorrectos.';
  if(c==='email_not_confirmed')return'Aún no has confirmado tu correo. Abre el enlace que te enviamos.';
  if(c==='user_already_exists'||c==='email_exists')return'Ya existe una cuenta con ese correo. Entra o recupera tu contraseña.';
  if(c==='weak_password')return'La contraseña es demasiado débil. Usa al menos '+MINPASS+' caracteres, con letras y números.';
  if(c==='same_password')return'La nueva contraseña debe ser distinta de la anterior.';
  if(c==='over_email_send_rate_limit'||e.status===429)return'Demasiados intentos seguidos. Espera unos minutos y vuelve a probar.';
  if(c==='unexpected_failure'||e.status>=500)return'No hemos podido enviar el correo. Inténtalo en unos minutos o escríbenos a '+DATOS.contacto+'.';
  return'No se ha podido completar la operación. Inténtalo de nuevo en unos minutos.'+(c?' (código: '+c+')':'')}
function vCuenta(app){
  const volver='<p><a href="#/">← Inicio</a></p>';
  if(!AUTH_ON){app.innerHTML=volver+`<section class="card stack"><h1>Cuenta</h1><p>El registro se abrirá en breve. Mientras tanto puedes estudiar los temas abiertos sin cuenta: tu progreso se guarda en este dispositivo.</p></section>`;return}
  const ok=window.__ok?`<p role="status"><strong>${esc(window.__ok)}</strong></p>`:'', er=window.__err?`<p class="err" role="alert">${esc(window.__err)}</p>`:'';
  const campoPass=(id,etq,auto)=>`<label for="${id}"><strong>${etq}</strong></label><input type="password" id="${id}" autocomplete="${auto}" minlength="${MINPASS}" required>`;
  const pie='<p class="err" id="msg" role="alert" hidden></p>';
  const err=t=>{const m=$('#msg');m.textContent=t;m.hidden=false};
  if(SES&&window.__modo==='nueva'){
    app.innerHTML=volver+`<section class="card stack"><h1>Elige tu contraseña</h1>${ok}<form id="frm" class="stack" novalidate>${campoPass('pw','Nueva contraseña (mínimo '+MINPASS+' caracteres)','new-password')}${pie}<div class="row"><button class="btn acc" type="submit" id="env">Guardar contraseña</button></div></form></section>`;
    $('#frm').onsubmit=async ev=>{ev.preventDefault();const pw=$('#pw').value;if(pw.length<MINPASS){err('Usa al menos '+MINPASS+' caracteres.');return}
      try{await nuevaClave(pw);window.__modo=null;window.__ok='Contraseña guardada.';sincroniza();render()}catch(e){err(msgError(e))}};return}
  if(SES){app.innerHTML=volver+`<section class="card stack"><h1>Mi cuenta</h1>${ok}
    <p>Has entrado como <strong>${esc(SES.email||'…')}</strong>. Tu progreso se sincroniza entre tus dispositivos <span class="muted">(${nube==='ok'?'al día':nube==='error'?'sin conexión ahora':'conectando…'})</span>.</p>
    ${PAGOS_ON?(ACC?`<p><strong>Temario completo activo${ACCHASTA?' hasta el '+ACCHASTA:''}.</strong></p>`:`<p>Tu cuenta es gratuita. <a href="#/comprar">Desbloquear el temario completo</a>.</p>`):''}
    ${PAGOS_ON&&ACC?`<section class="stack" aria-labelledby="facturas"><h2 id="facturas" style="font-size:1.15rem">Facturas</h2><div id="lista-fact"><p class="muted">Cargando…</p></div></section>`:''}
    <div class="row"><label for="nom"><b>Tu nombre</b> <span class="muted">(opcional, para saludarte)</span></label><input type="text" id="nom" maxlength="40" value="${esc(S.nombre||'')}" autocomplete="given-name" style="width:auto"><button type="button" class="btn ghost sm" id="nomb">Guardar nombre</button></div>
    <div class="row"><button type="button" class="btn" id="salir">Cerrar sesión</button><button type="button" class="btn ghost" id="cambiar">Cambiar contraseña</button>
    <a class="btn ghost" href="mailto:${esc(CONTACTO)}?subject=${encodeURIComponent('Eliminar mi cuenta de Ruta a la Plaza')}&amp;body=${encodeURIComponent('Solicito la supresión de mi cuenta y de mis datos. Correo de la cuenta: '+(SES.email||''))}">Pedir que eliminen mi cuenta</a></div>
    <p class="muted">Más información en la <a href="legal/privacidad.html">política de privacidad</a>.</p></section>`;
    if(PAGOS_ON&&ACC)cargaFacturas();
    $('#nomb').onclick=()=>{S.nombre=$('#nom').value.trim().slice(0,40);guardar();toast(S.nombre?'Nombre guardado':'Nombre borrado');render()};
    $('#salir').onclick=async()=>{window.__ok=null;await salir();location.hash='#/'};
    $('#cambiar').onclick=()=>{window.__modo='nueva';window.__ok=null;render()};return}
  const tab=window.__tab||'entrar';
  const tabs=`<div class="row" role="tablist"><button type="button" class="btn ${tab==='entrar'?'':'ghost'} sm" id="t-entrar">Entrar</button><button type="button" class="btn ${tab==='crear'?'':'ghost'} sm" id="t-crear">Crear cuenta</button></div>`;
  let cuerpo;
  if(tab==='crear')cuerpo=`<h1>Crear cuenta gratis</h1><p>Con cuenta, tu progreso se guarda en la nube y lo ves desde cualquier dispositivo. Dejamos constancia de tu alta (correo, fecha y versión de la política aceptada), como explica la <a href="legal/privacidad.html">política de privacidad</a>.</p>
    <form id="frm" class="stack" novalidate><label for="em"><strong>Correo electrónico</strong></label><input type="email" id="em" autocomplete="email" inputmode="email" required placeholder="nombre@ejemplo.com">
    ${campoPass('pw','Contraseña (mínimo '+MINPASS+' caracteres)','new-password')}
    <label class="chk"><input type="checkbox" id="pv" required><span>He leído y acepto la <a href="legal/privacidad.html" target="_blank" rel="noopener">política de privacidad</a>.</span></label>${pie}
    <div class="row"><button class="btn acc" type="submit" id="env">Crear cuenta</button></div></form>`;
  else if(tab==='olvido')cuerpo=`<h1>Recuperar contraseña</h1><p>Escribe tu correo y te enviaremos un enlace para elegir una contraseña nueva.</p>
    <form id="frm" class="stack" novalidate><label for="em"><strong>Correo electrónico</strong></label><input type="email" id="em" autocomplete="email" inputmode="email" required>${pie}
    <div class="row"><button class="btn acc" type="submit" id="env">Enviarme el enlace</button><button type="button" class="btn ghost" id="t-entrar">Volver</button></div></form>`;
  else cuerpo=`<h1>Entrar</h1><form id="frm" class="stack" novalidate><label for="em"><strong>Correo electrónico</strong></label><input type="email" id="em" autocomplete="email" inputmode="email" required>
    ${campoPass('pw','Contraseña','current-password')}${pie}
    <div class="row"><button class="btn acc" type="submit" id="env">Entrar</button><button type="button" class="btn ghost sm" id="t-olvido">He olvidado mi contraseña</button></div></form>`;
  app.innerHTML=volver+`<section class="card stack">${tab==='olvido'?'':tabs}${ok}${er}${cuerpo}</section>`;
  const ir=t=>()=>{window.__tab=t;window.__ok=window.__err=null;render()};
  const te=$('#t-entrar'),tc=$('#t-crear'),to=$('#t-olvido');if(te)te.onclick=ir('entrar');if(tc)tc.onclick=ir('crear');if(to)to.onclick=ir('olvido');
  const mailOk=em=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em);
  $('#frm').onsubmit=async ev=>{ev.preventDefault();const em=$('#em').value.trim(),b=$('#env'),txt=b.textContent;$('#msg').hidden=true;
    if(!mailOk(em)){err('Escribe un correo válido.');return}
    const pw=tab==='olvido'?null:$('#pw').value;
    if(tab!=='olvido'&&!pw){err('Escribe tu contraseña.');return}
    if(tab==='crear'){if(pw.length<MINPASS){err('La contraseña debe tener al menos '+MINPASS+' caracteres.');return}if(!$('#pv').checked){err('Para registrarte debes aceptar la política de privacidad.');return}}
    b.disabled=true;b.textContent='Un momento…';
    try{
      if(tab==='crear'){const r=await crearCuenta(em,pw);window.__tab='entrar';
        if(r==='dentro'){sincroniza();render()}else $('#frm').innerHTML=`<p><strong>Revisa tu correo.</strong> Te hemos enviado un enlace a <strong>${esc(em)}</strong> para confirmar tu cuenta. Después podrás entrar con tu contraseña. Si no llega en unos minutos, mira en spam.</p>`}
      else if(tab==='olvido'){await recuperar(em);$('#frm').innerHTML=`<p><strong>Revisa tu correo.</strong> Si existe una cuenta con <strong>${esc(em)}</strong>, te hemos enviado un enlace para elegir una contraseña nueva.</p>`}
      else{await entrar(em,pw);window.__ok=window.__err=null;sincroniza();render()}}
    catch(e){b.disabled=false;b.textContent=txt;err(msgError(e))}}}


/* ---------- Facturas (bajo petición, desde Mi cuenta) ---------- */
const eur=c=>(c/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
function formFactura(){return `<form id="ffac" class="stack" novalidate>
  <p class="muted" style="margin:0">Si necesitas factura, indícanos tus datos fiscales y la generamos al instante. Se emite una por compra y podrás verla e imprimirla cuando quieras.</p>
  <label for="fa-nom"><strong>Nombre o razón social</strong></label><input type="text" id="fa-nom" maxlength="150" autocomplete="name" required>
  <label for="fa-nif"><strong>NIF, NIE o CIF</strong></label><input type="text" id="fa-nif" maxlength="15" autocomplete="off" required>
  <label for="fa-dom"><strong>Domicilio fiscal</strong> <span class="muted">(calle, número, código postal y localidad)</span></label><input type="text" id="fa-dom" maxlength="250" autocomplete="street-address" required>
  <p class="err" id="fa-msg" role="alert" hidden></p>
  <div class="row"><button class="btn acc" type="submit" id="fa-env">Generar mi factura</button></div></form>`}
async function cargaFacturas(){const c=$('#lista-fact');if(!c)return;
  try{const t=await tokenValido();const f=await api('/rest/v1/facturas?select=id,numero,fecha,total_centimos,prueba&order=creada.desc',{token:t});
    if(f&&f.length){c.innerHTML=`<ul style="margin:0;padding-left:1.2em;display:grid;gap:6px">${f.map(x=>`<li><a href="#/factura/${x.id}">Factura ${esc(x.numero)}</a> · ${esc(fechaLarga(x.fecha))} · ${eur(x.total_centimos)}${x.prueba?' <span class="pill">de prueba</span>':''}</li>`).join('')}</ul>`;return}
    c.innerHTML=formFactura();const fo=$('#ffac');if(!fo)return;
    fo.onsubmit=async ev=>{ev.preventDefault();const b=$('#fa-env'),m=$('#fa-msg'),txt=b.textContent;m.hidden=true;
      const nom=($('#fa-nom').value||'').trim(),nif=($('#fa-nif').value||'').trim(),dom=($('#fa-dom').value||'').trim();
      if(nom.length<2||dom.length<5||nif.length<8){m.textContent='Rellena los tres datos.';m.hidden=false;return}
      b.disabled=true;b.textContent='Generando…';
      try{const r=await api('/rest/v1/rpc/pedir_factura',{method:'POST',token:await tokenValido(),body:{p_nombre:nom,p_nif:nif,p_domicilio:dom}});
        location.hash='#/factura/'+r.id}
      catch(e){b.disabled=false;b.textContent=txt;m.textContent=e.message==='nif_invalido'?'El NIF, NIE o CIF no parece válido. Revísalo.':e.message==='sin_pago'?'No encontramos ninguna compra pagada con esta cuenta.':e.message==='datos'?'Revisa los datos: alguno es demasiado corto o largo.':'No hemos podido generar la factura. Inténtalo de nuevo o escríbenos a '+CONTACTO+'.';m.hidden=false}}}
  catch(e){c.innerHTML='<p class="err">No hemos podido cargar tus facturas. Inténtalo de nuevo en unos minutos.</p>'}}
async function vFactura(app,id){
  if(!SES){location.hash='#/cuenta';return}
  if(!/^\d{1,12}$/.test(id||'')){location.hash='#/cuenta';return}
  app.innerHTML='<p>Cargando la factura…</p>';
  try{const t=await tokenValido();const r=await api('/rest/v1/facturas?id=eq.'+id+'&select=*',{token:t});const f=r&&r[0];
    if(!f){location.hash='#/cuenta';return}
    app.innerHTML=`<p class="noprint"><a href="#/cuenta">← Mi cuenta</a></p>
    <section class="card factura stack">${f.prueba?'<div class="aviso"><strong>FACTURA DE PRUEBA.</strong> Corresponde a un pago de prueba: no tiene validez fiscal.</div>':''}
      <div class="row" style="justify-content:space-between;align-items:start"><h1 style="font-size:1.8rem">Factura</h1><div style="text-align:right"><div class="mono"><strong>${esc(f.numero)}</strong></div><div class="muted">${esc(fechaLarga(f.fecha))}</div></div></div>
      <div class="grid2"><div><div class="eyebrow">Emisor</div><p><strong>${esc(f.emisor_nombre)}</strong><br>NIF ${esc(f.emisor_nif)}<br>${esc(f.emisor_domicilio)}<br>${esc(f.emisor_email)}</p></div>
        <div><div class="eyebrow">Cliente</div><p><strong>${esc(f.receptor_nombre)}</strong><br>NIF ${esc(f.receptor_nif)}<br>${esc(f.receptor_domicilio)}</p></div></div>
      <table style="display:table"><tr><th>Concepto</th><th style="text-align:right">Base</th><th style="text-align:right">IVA</th><th style="text-align:right">Total</th></tr>
        <tr><td>${esc(f.concepto)}</td><td style="text-align:right">${eur(f.base_centimos)}</td><td style="text-align:right">${esc(String(Number(f.tipo_iva)).replace('.',','))} % · ${eur(f.iva_centimos)}</td><td style="text-align:right"><strong>${eur(f.total_centimos)}</strong></td></tr></table>
      <p class="muted" style="font-size:.88rem;margin:0">Importe total pagado con IVA incluido. Factura emitida automáticamente a petición del cliente.</p></section>
    <div class="row noprint"><button type="button" class="btn acc" id="fprint">Imprimir o guardar como PDF</button><a class="btn ghost" href="#/cuenta">Volver</a></div>`;
    const pb=$('#fprint');if(pb)pb.onclick=()=>window.print()}
  catch(e){app.innerHTML='<section class="card stack"><h1>Factura</h1><p>No hemos podido cargarla. Inténtalo de nuevo en unos minutos.</p><div class="row"><a class="btn ghost" href="#/cuenta">Volver</a></div></section>'}}

/* ---------- Compra ---------- */
const avisoPrueba=()=>CFG.prueba?`<div class="aviso"><strong>Modo de prueba.</strong> La compra todavía no está abierta al público: no se cobra nada. Puedes recorrer todo el proceso con la tarjeta de prueba <span class="mono">4242 4242 4242 4242</span> (cualquier fecha futura y cualquier CVC) para revisarlo.</div>`:'';
function vComprar(app){
  const volver='<p><a href="#/">← Inicio</a></p>';
  if(!PAGOS_ON){location.hash='#/';return}
  const lista=`<ul style="margin:0;padding-left:1.2em"><li>Apuntes de los ${BLOQ.length} temas restantes, por artículos y con la cita del texto oficial.</li><li>Todas las preguntas de test (${TOT.preguntas-ORDEN.reduce((a,i)=>a+TEMAS[i].preguntas.length,0)} más), con explicación y cita literal.</li><li><strong>Temarios en audio</strong>: un podcast de repaso de cada tema para escucharlo y repasar en cualquier sitio, en el móvil, en el coche o paseando.</li><li><strong>Avisos por correo</strong> de los cambios de tu convocatoria publicados en el BOE o el BOJA (correcciones, listas de admitidos, fecha del examen…). Los activas con un clic en la ficha de la oposición.</li><li>Seguimiento de tu progreso y repaso de fallos.</li></ul>`;
  if(ACC){app.innerHTML=volver+`<section class="card stack"><h1>Ya tienes el temario completo</h1><p>Acceso activo${ACCHASTA?' hasta el '+esc(ACCHASTA):''}.</p><div class="row"><a class="btn acc" href="#temario">Ir al temario</a></div></section>`;return}
  if(!SES){app.innerHTML=volver+`<section class="card stack"><h1>Temario completo · ${esc(PRECIO)}</h1>${lista}<p>Pago único, sin suscripción. Para comprar necesitas una cuenta gratuita (así el acceso queda ligado a tu correo).</p><div class="row"><a class="btn acc" href="#/cuenta">Crear cuenta o entrar</a></div></section>`;return}
  app.innerHTML=volver+`<section class="card stack"><h1>Temario completo · ${esc(PRECIO)}</h1>${avisoPrueba()}${lista}
    <p class="muted">Pago único con tarjeta a través de Stripe, sin suscripción. Acceso digital a tu cuenta (<strong>${esc(SES.email||'')}</strong>) durante ${esc(DATOS.acceso||'el periodo indicado en las condiciones')}. Nosotros no vemos ni guardamos los datos de tu tarjeta. Puedes pedir tu factura desde «Mi cuenta» una vez comprado.</p>
    <form id="frm" class="stack" novalidate>
      <label class="row" style="align-items:flex-start;gap:8px"><input type="checkbox" id="c1"><span>He leído y acepto las <a href="legal/condiciones.html" target="_blank" rel="noopener">condiciones de contratación</a> y la <a href="legal/privacidad.html" target="_blank" rel="noopener">política de privacidad</a>.</span></label>
      <label class="row" style="align-items:flex-start;gap:8px"><input type="checkbox" id="c3"><span>Declaro que <strong>resido en España</strong>: solo vendemos a clientes con domicilio en España.</span></label>
      <label class="row" style="align-items:flex-start;gap:8px"><input type="checkbox" id="c2"><span>Solicito el acceso inmediato al contenido digital y reconozco que, una vez comenzado, <strong>pierdo el derecho de desistimiento</strong>.</span></label>
      <p class="err" id="msg" role="alert" hidden></p>
      <div class="row"><button class="btn acc" type="submit" id="env">Pagar ${esc(PRECIO)}</button></div></form></section>`;
  const err=t=>{const m=$('#msg');m.textContent=t;m.hidden=false};
  $('#frm').onsubmit=async ev=>{ev.preventDefault();const b=$('#env');
    if(!$('#c1').checked||!$('#c2').checked||!$('#c3').checked){err('Marca las tres casillas para continuar.');return}
    b.disabled=true;b.textContent='Un momento…';
    try{const t=await tokenValido();if(!t)throw new Error('sesion');
      const r=await fetch(CFG.url+'/functions/v1/crear-pago',{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+t,'Content-Type':'application/json'},
        body:JSON.stringify({acepta_condiciones:true,acepta_inicio_inmediato:true,residente_espana:true,version_condiciones:VCOND})});
      const j=await r.json().catch(()=>({}));
      if(r.status===409){await cargaAcceso();render();return}
      if(r.status===403&&j.error==='correo_sin_confirmar'){b.disabled=false;b.textContent='Pagar '+PRECIO;err('Confirma primero tu correo con el enlace que te enviamos.');return}
      if(!r.ok||!/^https:\/\/checkout\.stripe\.com\//.test(j.url||''))throw new Error('pago');
      location.href=j.url}
    catch(e){b.disabled=false;b.textContent='Pagar '+PRECIO;err('No hemos podido iniciar el pago. Inténtalo de nuevo en unos minutos o escríbenos a '+CONTACTO+'.')}}}
function vGracias(app){
  app.innerHTML=`<section class="card stack"><h1>¡Gracias!</h1><p role="status" id="est">Estamos confirmando tu pago…</p><div class="row"><a class="btn acc" href="#temario" id="ir" hidden>Ir al temario completo</a></div>
    <p class="muted">Si en unos minutos no se activa, escríbenos a <a href="mailto:${esc(CONTACTO)}">${esc(CONTACTO)}</a> indicando tu correo. Recibirás el justificante de Stripe en tu correo.</p></section>`;
  let n=0;const paso=async()=>{if(!/^#\/gracias/.test(location.hash))return;await cargaAcceso();
    if(ACC){const e=$('#est');if(e)e.textContent='Pago confirmado. Ya tienes el temario completo.';const a=$('#ir');if(a)a.hidden=false;pintaCuenta();return}
    if(++n<30)setTimeout(paso,2000);else{const e=$('#est');if(e)e.textContent='El pago aún no consta. Puede tardar unos minutos: vuelve a mirar en “Mi cuenta”.'}};paso()}

/* ---------- Router ---------- */
function render(){const app=$('#app'),h=location.hash.replace(/^#\/?/,'').split('/');
  pintaCuenta();pintaNav();
  if(h[0]==='tema')vTema(app,h[1]);else if(h[0]==='test')vTest(app,h[1]);else if(h[0]==='cuenta')vCuenta(app);else if(h[0]==='comprar')vComprar(app);else if(h[0]==='gracias')vGracias(app);
  else if(h[0]==='hoy')vHoy(app);else if(h[0]==='temario')vTemario(app);else if(h[0]==='tests')vTests(app);else if(h[0]==='plan')vPlan(app);else if(h[0]==='proceso')vProceso(app,h[1]);
  else if(h[0]==='oposiciones')vOposiciones(app);else if(h[0]==='oposicion')vOpo(app,h[1]);
  else if(h[0]==='confirmar'||h[0]==='baja')vToken(app,h[1],h[0]);else if(h[0]==='factura')vFactura(app,h[1]);
  else if(SES&&!h[0])vHoy(app);else vInicio(app);
  const ancla=!['tema','test','tests','cuenta','comprar','gracias','hoy','temario','plan','proceso','oposiciones','oposicion','confirmar','baja','factura'].includes(h[0])&&h[0]&&document.getElementById(h[0]);   // enlaces internos: #gratis, #temario
  if(ancla)ancla.scrollIntoView();else if(h[0]!=='test'||!T)window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{if(!location.hash.startsWith('#/test/')){paraCron();T=null}render()});
$('#borrar').onclick=()=>{if(confirm('¿Borrar el progreso guardado en este dispositivo?')){paraCron();T=null;S=Object.assign(nuevoS(),{examDate:S.examDate});try{localStorage.removeItem(KEY)}catch(e){}if(SES){S.upd=Date.now();subir().catch(()=>{})}toast('Progreso borrado');render()}};
const pp=$('#pie-pagos');if(pp&&PAGOS_ON)pp.innerHTML=' · <a href="legal/condiciones.html">Condiciones de contratación</a> · <a href="legal/desistimiento.html">Desistimiento</a>';
capturaEnlace();render();if(SES)sincroniza();
</script>
