<script>
const DATOS={"temas":{"g1":{"id":"g1","num":1,"titulo":"La Constitución Española","alcance":"Título Preliminar; Título I (derechos y deberes fundamentales); Título IV (Gobierno y Administración).","bloque":"General","fuentes":["BOE-A-1978-31229 (Constitución Española, texto consolidado)"],"notas":["Para este tema te conviene dominar al detalle: los valores superiores (art. 1.1), las garantías del art. 9.3, el art. 14 (igualdad), el art. 17.2 (72 horas de detención), el art. 23.2 (acceso a funciones públicas), el art. 27.10 (autonomía de las Universidades) y los principios de la Administración (art. 103).","Se pregunta con frecuencia el número exacto o la lista completa. Cuenta los elementos de cada lista (por ejemplo, los cinco principios del art. 103.1) para detectar la opción falsa."],"apuntes":[{"h":"Título Preliminar (arts. 1 a 9)","t":"- **Art. 1.1**: España es un Estado **social y democrático de Derecho**. Valores superiores: **libertad, justicia, igualdad y pluralismo político**.\n- **Art. 1.2**: la soberanía nacional reside en el **pueblo español**, del que emanan los poderes del Estado.\n- **Art. 1.3**: la forma política del Estado es la **Monarquía parlamentaria**.\n- **Art. 2**: unidad indisoluble de la Nación española; reconoce y garantiza el derecho a la autonomía de las **nacionalidades y regiones** y la solidaridad entre ellas.\n- **Art. 3**: el **castellano** es la lengua española oficial del Estado; las demás lenguas españolas serán también oficiales en sus Comunidades Autónomas.\n- **Art. 4**: bandera de España (rojo, amarillo y rojo; la franja amarilla de doble anchura). **Art. 5**: la capital del Estado es **Madrid**.\n- **Art. 6**: partidos políticos. **Art. 7**: sindicatos y asociaciones empresariales. **Art. 8**: Fuerzas Armadas (garantizan la soberanía e independencia de España y defienden su integridad territorial y el ordenamiento constitucional).\n- **Art. 9**: los ciudadanos y los poderes públicos están **sujetos a la Constitución y al resto del ordenamiento**. Garantiza: **legalidad, jerarquía normativa, publicidad de las normas, irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales, seguridad jurídica, responsabilidad e interdicción de la arbitrariedad** de los poderes públicos."},{"h":"Título I: estructura","t":"El Título I se llama «De los derechos y deberes fundamentales» (arts. 10 a 55) y tiene cinco capítulos:\n- **Cap. I** (arts. 11-13): españoles y extranjeros.\n- **Cap. II** (arts. 14-38): derechos y libertades. **Sección 1.ª** (arts. 15-29): derechos fundamentales y libertades públicas. **Sección 2.ª** (arts. 30-38): derechos y deberes de los ciudadanos.\n- **Cap. III** (arts. 39-52): principios rectores de la política social y económica.\n- **Cap. IV** (arts. 53-54): garantías de las libertades y derechos fundamentales.\n- **Cap. V** (art. 55): suspensión de los derechos y libertades.\n\n**Art. 10**: la dignidad de la persona, los derechos inviolables que le son inherentes y el libre desarrollo de la personalidad son fundamento del orden político y de la paz social. Las normas sobre derechos fundamentales se interpretan de conformidad con la **Declaración Universal de Derechos Humanos** y los tratados internacionales ratificados por España."},{"h":"Capítulo I: españoles y extranjeros","t":"- **Art. 11**: la nacionalidad se adquiere, conserva y pierde según la ley. **Ningún español de origen podrá ser privado de su nacionalidad.**\n- **Art. 12**: los españoles son mayores de edad a los **dieciocho años**.\n- **Art. 13**: los extranjeros gozan de las libertades públicas del Título I en los términos de los tratados y la ley. Solo los españoles son titulares de los derechos del **art. 23** (participación política), salvo reciprocidad para el sufragio en elecciones **municipales**. Se excluyen de la extradición los delitos políticos (no se consideran tales los actos de terrorismo)."},{"h":"Derechos fundamentales y libertades públicas (Sección 1.ª)","t":"- **Art. 14**: igualdad ante la ley; no discriminación por nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social.\n- **Art. 15**: derecho a la vida y a la integridad física y moral; abolición de la pena de muerte salvo lo que dispongan las leyes penales militares para tiempos de guerra.\n- **Art. 16**: libertad ideológica, religiosa y de culto. Nadie puede ser obligado a declarar sobre su ideología, religión o creencias.\n- **Art. 17**: libertad y seguridad. La detención preventiva no puede durar más del tiempo estrictamente necesario y, en todo caso, **setenta y dos horas**, plazo en el que el detenido debe ser puesto en libertad o a disposición de la autoridad judicial. Derecho de **habeas corpus**.\n- **Art. 18**: honor, intimidad y propia imagen; inviolabilidad del domicilio; secreto de las comunicaciones; limitación del uso de la informática.\n- **Art. 19**: libertad de residencia y circulación. **Art. 20**: libertad de expresión, información, cátedra y producción artística; no puede restringirse mediante censura previa. **Art. 21**: reunión pacífica y sin armas. **Art. 22**: asociación. **Art. 23**: participación en asuntos públicos y acceso a funciones y cargos públicos **en condiciones de igualdad, con los requisitos que señalen las leyes**.\n- **Art. 24**: tutela judicial efectiva, juez ordinario predeterminado por la ley, defensa, presunción de inocencia. **Art. 25**: legalidad penal. **Art. 27**: derecho a la **educación** y libertad de enseñanza; se reconoce la **autonomía de las Universidades** en los términos que la ley establezca. **Art. 28**: sindicación y huelga. **Art. 29**: derecho de petición individual y colectiva, por escrito."},{"h":"Derechos y deberes de los ciudadanos (Sección 2.ª)","t":"- **Art. 30**: derecho y deber de defender a España; objeción de conciencia.\n- **Art. 31**: deber de contribuir al sostenimiento de los gastos públicos.\n- **Art. 32**: matrimonio en plena igualdad jurídica. **Art. 33**: propiedad privada y herencia. **Art. 34**: fundaciones. **Art. 35**: deber de trabajar y derecho al trabajo. **Art. 36**: colegios profesionales. **Art. 37**: negociación colectiva. **Art. 38**: libertad de empresa."},{"h":"Principios rectores y garantías (Capítulos III, IV y V)","t":"- **Capítulo III (arts. 39-52)**: protección de la familia, seguridad social, salud, cultura (**art. 44**), medio ambiente, vivienda, juventud, personas con discapacidad, tercera edad, consumidores. Solo se alegan ante la jurisdicción ordinaria **de acuerdo con las leyes que los desarrollen** (art. 53.3).\n- **Art. 53.1**: los derechos del Capítulo II **vinculan a todos los poderes públicos**; solo por **ley**, que respete su **contenido esencial**, puede regularse su ejercicio.\n- **Art. 53.2**: tutela ante los tribunales ordinarios por un procedimiento basado en los principios de **preferencia y sumariedad** y, en su caso, recurso de **amparo** ante el Tribunal Constitucional (para el art. 14, la Sección 1.ª y la objeción de conciencia del art. 30).\n- **Art. 54**: el **Defensor del Pueblo** es el alto comisionado de las Cortes Generales, designado por estas para la defensa de los derechos del Título I; regulado por ley orgánica.\n- **Art. 55**: los derechos de los arts. 17, 18.2 y 18.3, 19, 20.1.a) y d) y 20.5, 21, 28.2 y 37.2 pueden suspenderse con la declaración de los estados de excepción o de sitio."},{"h":"Título IV: el Gobierno y la Administración (arts. 97 a 107)","t":"- **Art. 97**: el Gobierno dirige la política interior y exterior, la Administración civil y militar y la defensa del Estado; ejerce la función ejecutiva y la **potestad reglamentaria**.\n- **Art. 98**: el Gobierno se compone del **Presidente, Vicepresidentes (en su caso), Ministros** y demás miembros que establezca la ley. El Presidente dirige la acción del Gobierno.\n- **Art. 99**: investidura. El Rey propone un candidato a través del Presidente del Congreso; si el Congreso otorga su confianza por **mayoría absoluta**, el Rey le nombra Presidente; si no, nueva votación a las **48 horas** y basta la **mayoría simple**.\n- **Art. 100**: los demás miembros del Gobierno son nombrados y separados por el **Rey, a propuesta del Presidente**.\n- **Art. 101**: el Gobierno cesa tras elecciones generales, pérdida de confianza parlamentaria, o dimisión o fallecimiento del Presidente; el cesante continúa en funciones.\n- **Art. 102**: la responsabilidad criminal del Presidente y los miembros del Gobierno es exigible ante la **Sala de lo Penal del Tribunal Supremo**.\n- **Art. 103**: la Administración Pública sirve con **objetividad** los intereses generales y actúa de acuerdo con los principios de **eficacia, jerarquía, descentralización, desconcentración y coordinación**, con sometimiento pleno a la **ley y al Derecho**. El acceso a la función pública se regula conforme a los principios de **mérito y capacidad**. La ley regulará el estatuto de los funcionarios, su derecho a sindicación, las incompatibilidades y las garantías de imparcialidad.\n- **Art. 104**: las Fuerzas y Cuerpos de seguridad, bajo la dependencia del Gobierno, protegen el libre ejercicio de los derechos y libertades y garantizan la seguridad ciudadana.\n- **Art. 105**: la ley regulará la **audiencia** de los ciudadanos en la elaboración de disposiciones administrativas, el **acceso a archivos y registros administrativos** (salvo seguridad y defensa del Estado, averiguación de delitos e intimidad) y el procedimiento administrativo.\n- **Art. 106**: los Tribunales controlan la potestad reglamentaria y la legalidad de la actuación administrativa; los particulares tienen derecho a ser **indemnizados** por las lesiones causadas por el funcionamiento de los servicios públicos, salvo fuerza mayor.\n- **Art. 107**: el **Consejo de Estado** es el supremo órgano consultivo del Gobierno."}],"clave":["Art. 1.1: libertad, justicia, igualdad y pluralismo político.","Art. 9.3: legalidad, jerarquía normativa, publicidad, irretroactividad, seguridad jurídica, responsabilidad, interdicción de la arbitrariedad.","Art. 17.2: detención preventiva máxima de 72 horas.","Art. 99: mayoría absoluta; a las 48 horas, mayoría simple.","Art. 103.1: eficacia, jerarquía, descentralización, desconcentración, coordinación.","Art. 103.3: acceso a la función pública por mérito y capacidad."],"preguntas":[{"q":"Según el artículo 1.1 de la Constitución, ¿cuál de los siguientes NO es un valor superior del ordenamiento jurídico?","o":["La libertad","La justicia","La solidaridad","El pluralismo político"],"c":2,"ref":["CE","1","la libertad, la justicia, la igualdad y el pluralismo político"],"e":"Los cuatro valores superiores son libertad, justicia, igualdad y pluralismo político. La solidaridad se cita en el art. 2, pero no como valor superior."},{"q":"La forma política del Estado español es:","o":["La República parlamentaria","La Monarquía parlamentaria","La Monarquía constitucional federal","La República presidencialista"],"c":1,"ref":["CE","1","la forma política del estado español es la monarquía parlamentaria"],"e":"Art. 1.3 CE."},{"q":"¿Qué lengua es la oficial del Estado según el artículo 3 de la Constitución?","o":["El castellano, que todos los españoles tienen el deber de conocer y el derecho a usar","El castellano y las lenguas cooficiales en todo el territorio","El castellano únicamente en las Administraciones del Estado","Ninguna, la Constitución no establece lengua oficial"],"c":0,"ref":["CE","3","todos los españoles tienen el deber de conocerla y el derecho a usarla"],"e":"Art. 3.1: el castellano es la lengua española oficial del Estado; todos tienen el deber de conocerla y el derecho a usarla. Las demás lenguas son oficiales en sus Comunidades Autónomas (art. 3.2)."},{"q":"¿Cuál es la capital del Estado según la Constitución?","o":["Madrid","Toledo","Barcelona","No la define"],"c":0,"ref":["CE","5","la capital del estado es la villa de madrid"],"e":"Art. 5 CE."},{"q":"Según el artículo 9.3 de la Constitución, ¿cuál de los siguientes principios garantiza?","o":["La irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales","La retroactividad de todas las leyes","La discrecionalidad de los poderes públicos","La inmunidad de los poderes públicos"],"c":0,"ref":["CE","9","la irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales"],"e":"Art. 9.3 CE. Junto a la legalidad, jerarquía normativa, publicidad, seguridad jurídica, responsabilidad e interdicción de la arbitrariedad."},{"q":"El artículo 10.2 de la Constitución establece que las normas sobre derechos fundamentales se interpretarán de conformidad con:","o":["La Declaración Universal de Derechos Humanos y los tratados internacionales ratificados por España","La jurisprudencia del Tribunal Supremo","Los Estatutos de Autonomía","El Código Civil"],"c":0,"ref":["CE","10","declaración universal de derechos humanos"],"e":"Art. 10.2 CE."},{"q":"¿A qué edad son mayores de edad los españoles según la Constitución?","o":["A los dieciséis años","A los dieciocho años","A los veintiún años","A los diecinueve años"],"c":1,"ref":["CE","12","los españoles son mayores de edad a los dieciocho años"],"e":"Art. 12 CE."},{"q":"Según el artículo 11.2 de la Constitución:","o":["Ningún español de origen podrá ser privado de su nacionalidad","Un español puede ser privado de su nacionalidad por sentencia firme","La nacionalidad se pierde al residir diez años en el extranjero","La nacionalidad solo se adquiere por nacimiento"],"c":0,"ref":["CE","11","ningún español de origen podrá ser privado de su nacionalidad"],"e":"Art. 11.2 CE."},{"q":"¿Cuál es la duración máxima de la detención preventiva según el artículo 17 de la Constitución?","o":["Veinticuatro horas","Cuarenta y ocho horas","Setenta y dos horas","Cinco días"],"c":2,"ref":["CE","17","setenta y dos horas"],"e":"Art. 17.2: el tiempo estrictamente necesario y, en todo caso, setenta y dos horas."},{"q":"El artículo 14 de la Constitución proclama:","o":["La igualdad de los españoles ante la ley, sin que pueda prevalecer discriminación alguna","El derecho a la vida y a la integridad física","La libertad ideológica","El derecho de reunión"],"c":0,"ref":["CE","14","los españoles son iguales ante la ley"],"e":"Art. 14 CE."},{"q":"¿Qué artículo de la Constitución reconoce la autonomía de las Universidades?","o":["El artículo 20","El artículo 27","El artículo 44","El artículo 103"],"c":1,"ref":["CE","27","se reconoce la autonomía de las universidades"],"e":"Art. 27.10 CE: «Se reconoce la autonomía de las Universidades, en los términos que la ley establezca»."},{"q":"Según el artículo 29 de la Constitución, el derecho de petición se ejerce:","o":["Individual y colectivamente, por escrito","Solo individualmente y por cualquier medio","Solo colectivamente","Verbalmente ante el Defensor del Pueblo"],"c":0,"ref":["CE","29","individual y colectiva, por escrito"],"e":"Art. 29.1 CE."},{"q":"El artículo 23.2 de la Constitución reconoce el derecho de los ciudadanos a acceder en condiciones de igualdad a las funciones y cargos públicos:","o":["Con los requisitos que señalen las leyes","Sin ningún requisito","Solo mediante elección","Solo si se tiene la nacionalidad de origen"],"c":0,"ref":["CE","23","con los requisitos que señalen las leyes"],"e":"Art. 23.2 CE."},{"q":"¿Dónde se encuentran regulados los principios rectores de la política social y económica?","o":["Capítulo II del Título I","Capítulo III del Título I","Capítulo IV del Título I","Título Preliminar"],"c":1,"ref":["CE","53","los principios reconocidos en el capítulo tercero"],"e":"Capítulo tercero del Título I, arts. 39 a 52."},{"q":"Según el artículo 53.1 de la Constitución, el ejercicio de los derechos y libertades del Capítulo segundo solo puede regularse:","o":["Por ley, que en todo caso deberá respetar su contenido esencial","Por reglamento del Gobierno","Por decreto-ley en todo caso","Por los Estatutos de Autonomía"],"c":0,"ref":["CE","53","que en todo caso deberá respetar su contenido esencial"],"e":"Art. 53.1 CE."},{"q":"El recurso de amparo ante el Tribunal Constitucional protege, según el artículo 53.2:","o":["El artículo 14, la Sección primera del Capítulo segundo y la objeción de conciencia del artículo 30","Todos los derechos del Título I","Solo los principios rectores","Solo los derechos de la Sección segunda"],"c":0,"ref":["CE","53","este último recurso será aplicable a la objeción de conciencia reconocida en el artículo 30"],"e":"Art. 53.2 CE."},{"q":"El Defensor del Pueblo es, según el artículo 54 de la Constitución:","o":["El alto comisionado de las Cortes Generales","Un órgano dependiente del Gobierno","Un órgano del Poder Judicial","Un comisionado del Consejo de Estado"],"c":0,"ref":["CE","54","alto comisionado de las cortes generales"],"e":"Art. 54 CE, regulado por ley orgánica."},{"q":"¿Quién nombra y separa a los Ministros según el artículo 100 de la Constitución?","o":["El Presidente del Gobierno","El Rey, a propuesta del Presidente del Gobierno","El Congreso de los Diputados","El Presidente del Congreso"],"c":1,"ref":["CE","100","nombrados y separados por el rey, a propuesta de su presidente"],"e":"Art. 100 CE."},{"q":"En la investidura, si el candidato no obtiene la mayoría absoluta, ¿cuándo se vota de nuevo y qué mayoría se exige?","o":["A las 48 horas, mayoría simple","A las 24 horas, mayoría absoluta","A los 7 días, mayoría simple","A las 72 horas, mayoría de tres quintos"],"c":0,"ref":["CE","99","cuarenta y ocho horas después de la anterior"],"e":"Art. 99.3 CE: nueva votación 48 horas después; basta mayoría simple."},{"q":"La responsabilidad criminal del Presidente y los miembros del Gobierno es exigible ante:","o":["El Tribunal Constitucional","La Sala de lo Penal del Tribunal Supremo","La Audiencia Nacional","El Congreso de los Diputados"],"c":1,"ref":["CE","102","sala de lo penal del tribunal supremo"],"e":"Art. 102.1 CE."},{"q":"¿Cuál de los siguientes NO es un principio de actuación de la Administración Pública según el artículo 103.1?","o":["Eficacia","Jerarquía","Competitividad","Desconcentración"],"c":2,"ref":["CE","103","eficacia, jerarquía, descentralización, desconcentración y coordinación"],"e":"Los principios son eficacia, jerarquía, descentralización, desconcentración y coordinación."},{"q":"El acceso a la función pública se regula, según el artículo 103.3, de acuerdo con los principios de:","o":["Mérito y capacidad","Antigüedad y experiencia","Libre designación y confianza","Igualdad y publicidad"],"c":0,"ref":["CE","103","los principios de mérito y capacidad"],"e":"Art. 103.3 CE."},{"q":"Según el artículo 105 de la Constitución, el acceso de los ciudadanos a los archivos y registros administrativos tiene como excepciones:","o":["La seguridad y defensa del Estado, la averiguación de los delitos y la intimidad de las personas","Solo la seguridad nacional","Los documentos con más de 50 años","Ninguna"],"c":0,"ref":["CE","105","la seguridad y defensa del estado, la averiguación de los delitos y la intimidad de las personas"],"e":"Art. 105.b CE."},{"q":"Según el artículo 106.2 de la Constitución, los particulares tienen derecho a ser indemnizados por las lesiones que sufran como consecuencia del funcionamiento de los servicios públicos:","o":["Salvo en los casos de fuerza mayor","Siempre, sin excepciones","Solo si hay dolo del funcionario","Solo si lo decide el Consejo de Estado"],"c":0,"ref":["CE","106","salvo en los casos de fuerza mayor"],"e":"Art. 106.2 CE."},{"q":"El supremo órgano consultivo del Gobierno es:","o":["El Consejo de Estado","El Consejo General del Poder Judicial","El Tribunal de Cuentas","El Defensor del Pueblo"],"c":0,"ref":["CE","107","supremo órgano consultivo del gobierno"],"e":"Art. 107 CE."}],"audio":"audio/g1-podcast.mp3"},"g2":{"id":"g2","num":2,"titulo":"Ley Orgánica del Sistema Universitario (LOSU)","alcance":"Ley Orgánica 2/2023, de 22 de marzo: Título Preliminar; Títulos I a IV; Título IX, capítulo I (arts. 1 a 13 y 38 a 43).","bloque":"General","fuentes":["BOE-A-2023-7500 (Ley Orgánica 2/2023, texto consolidado)"],"notas":["Estudia solo los artículos 1 a 13 y 38 a 43. El resto de la ley no entra en el programa.","La LOSU (Ley Orgánica 2/2023) sustituye a la antigua LOU de 2001. Si usas apuntes viejos, comprueba que hablan de la LOSU y no de la LOU.","Se repiten mucho el art. 3 (autonomía), el art. 38.4 (qué órganos agotan la vía administrativa) y el art. 12 (Ciencia Abierta y repositorios, que conecta con Digibug)."],"apuntes":[{"h":"Objeto y concepto (art. 1)","t":"- Regula el **sistema universitario** y los mecanismos de **coordinación, cooperación y colaboración** entre las Administraciones con competencias universitarias.\n- **Sistema universitario**: el conjunto de universidades, públicas y privadas, y de los centros y estructuras que les sirven para el desarrollo de sus funciones.\n- **Universidades**: instituciones públicas o privadas que desarrollan las funciones centrales de **docencia, investigación y transferencia e intercambio del conocimiento** y ofertan títulos oficiales de **Grado, Máster Universitario y Doctorado** en la mayoría de ramas de conocimiento."},{"h":"Título I: funciones y autonomía (arts. 2 y 3)","t":"- **Art. 2.1**: el sistema universitario presta y garantiza el **servicio público de la educación superior universitaria** mediante la docencia, la investigación y la transferencia del conocimiento.\n- **Art. 2.2**: funciones de las universidades (educación y formación; preparación profesional; generación y transferencia del conocimiento; innovación; bienestar social y progreso económico; espacios de pensamiento crítico; formación de la ciudadanía en valores democráticos; fomento del voluntariado y del tercer sector).\n- **Art. 2.3**: referentes: derechos humanos, memoria democrática, equidad e igualdad, sostenibilidad, lucha contra el cambio climático y los Objetivos de Desarrollo Sostenible.\n- **Art. 3.1**: las universidades tienen **personalidad jurídica** y actúan con **autonomía** en virtud del derecho fundamental del **art. 27.10 de la Constitución**.\n- **Art. 3.2**: la autonomía comprende, entre otras cosas, elaborar sus **Estatutos**, determinar su organización y estructuras, elegir y remover a sus órganos de gobierno, la autonomía económica y financiera, aprobar planes de estudio, expedir títulos, seleccionar y promover a su personal (PDI y PTGAS), establecer sus **relaciones de puestos de trabajo**, admitir al estudiantado y definir sistemas internos de garantía de calidad.\n- **Art. 3.3**: la autonomía garantiza la **libertad de cátedra** (docencia, investigación y estudio).\n- **Art. 3.5**: las universidades deben **rendir cuentas** a la sociedad, gestionar con transparencia y ofrecer un servicio público de calidad."},{"h":"Título II: creación y calidad (arts. 4 y 5)","t":"- **Art. 4.1**: las universidades públicas se crean (y las privadas se reconocen) **por ley de la Asamblea Legislativa de la Comunidad Autónoma**, previo informe preceptivo de la **Conferencia General de Política Universitaria**; o por ley de las **Cortes Generales** si son de especiales características.\n- **Art. 4.2**: el Gobierno, por **real decreto**, fija las condiciones básicas; la **Comunidad Autónoma** autoriza el inicio de actividades y supervisa su cumplimiento.\n- **Art. 4.3**: requisito de creación: planes de **igualdad de género**, medidas contra la brecha salarial, **accesibilidad** y ajustes razonables y medidas contra la violencia, discriminación o acoso (Ley 3/2022 de convivencia universitaria).\n- **Art. 5**: buen gobierno y calidad conforme a los estándares del **Espacio Europeo de Educación Superior**. La calidad es responsabilidad compartida de universidades, agencias de evaluación y Administraciones. Acreditación y evaluación: **ANECA** y agencias autonómicas inscritas en **EQAR**."},{"h":"Título III: organización de enseñanzas (arts. 6 a 10)","t":"- **Art. 6**: la **docencia** es función fundamental; es un derecho y un deber del PDI; preferentemente **presencial**, puede ser virtual o híbrida. Participación efectiva del estudiantado en planes de estudio. Docencia oficial (Grado, Máster, Doctorado) y títulos propios.\n- **Art. 7**: títulos **oficiales** (validez en todo el Estado) y **propios**. Los oficiales se inscriben en el **Registro de Universidades, Centros y Títulos**, con efectos **constitutivos**. Se prevén microcredenciales.\n- **Art. 8**: los títulos oficiales los expide, **en nombre del Rey**, el **Rector o Rectora**. Para impartir una enseñanza oficial: informe de la Comunidad Autónoma, informe de la agencia de calidad, verificación del **Consejo de Universidades** y autorización de la Comunidad Autónoma.\n- **Art. 9**: tres ciclos: **Grado** (formación básica y generalista), **Máster Universitario** (formación avanzada y especializada) y **Doctorado** (competencias de investigación).\n- **Art. 10**: el Gobierno regula convalidaciones, **homologación** y **equivalencia** de títulos extranjeros y reconocimiento de la experiencia laboral."},{"h":"Título IV: investigación (arts. 11 a 13)","t":"- **Art. 11**: la **investigación** es función fundamental; derecho y deber del PDI.\n- **Art. 12**: el conocimiento científico es un **bien común**; **Ciencia Abierta**: acceso abierto a publicaciones, datos, códigos y metodologías. El PDI debe depositar la versión final aceptada y sus datos en **repositorios institucionales o temáticos de acceso abierto**, simultáneamente a la publicación. (Conecta con **Digibug**.)\n- **Art. 13**: las Administraciones fomentan la investigación y el desarrollo tecnológico universitarios."},{"h":"Título IX, capítulo I: universidades públicas (arts. 38 a 43)","t":"- **Art. 38.1**: las universidades públicas se rigen por la **LOSU**, la **ley de su creación** y sus **Estatutos**, elaborados por ellas y **aprobados, previo control de legalidad, por la Comunidad Autónoma**. Plazo de la Comunidad para el informe de legalidad: **cuatro meses** (art. 38.2). Los Estatutos se publican en el diario oficial de la Comunidad y en el **BOE**.\n- **Art. 38.4**: las resoluciones del **Rector o Rectora** y los acuerdos del **Consejo Social, Consejo de Gobierno y Claustro** **ponen fin a la vía administrativa**.\n- **Art. 39**: rendición de cuentas y transparencia; las universidades deben tener un **portal de transparencia**.\n- **Art. 40**: estructura posible según los Estatutos: **campus, facultades, escuelas, departamentos, institutos universitarios de investigación, escuelas de doctorado** y otros centros.\n- **Art. 41**: facultades y escuelas se crean, modifican y suprimen por **acuerdo de la Comunidad Autónoma**, a iniciativa de la universidad (propuesta y aprobación de su Consejo de Gobierno). Departamentos, institutos, escuelas de doctorado y otros centros: **la propia universidad**.\n- **Art. 42**: la **adscripción** de centros docentes requiere convenio con la universidad y aprobación de la Comunidad Autónoma; un centro solo puede adscribirse a **una única universidad** (salvo excepción).\n- **Art. 43**: toda universidad contará con **unidades de igualdad y de diversidad**, **defensoría universitaria**, **inspección de servicios**, servicios de salud y acompañamiento psicológico y pedagógico y orientación profesional."}],"clave":["Art. 3.1: autonomía universitaria = derecho fundamental del art. 27.10 CE.","Art. 4.1: universidades públicas se crean por ley de la Asamblea de la Comunidad Autónoma.","Art. 8.1: el Rector expide los títulos en nombre del Rey.","Art. 9.1: tres ciclos: Grado, Máster y Doctorado.","Art. 38.2: cuatro meses para el informe de legalidad de los Estatutos.","Art. 38.4: Rector, Consejo Social, Consejo de Gobierno y Claustro agotan la vía administrativa."],"preguntas":[{"q":"Según el artículo 1 de la LOSU, ¿cuáles son las funciones centrales de las universidades?","o":["Docencia, investigación y transferencia e intercambio del conocimiento","Docencia, gestión y extensión universitaria","Investigación, publicación y cooperación internacional","Docencia, tutoría y evaluación"],"c":0,"ref":["LOSU","1","docencia, investigación y transferencia e intercambio del conocimiento"],"e":"Art. 1.2 LOSU."},{"q":"El sistema universitario presta y garantiza, según el artículo 2.1 de la LOSU:","o":["El servicio público de la educación superior universitaria","La educación obligatoria y gratuita","La investigación pública exclusivamente","La formación profesional de grado superior"],"c":0,"ref":["LOSU","2","el servicio público de la educación superior universitaria"],"e":"Art. 2.1 LOSU."},{"q":"La autonomía de las universidades se reconoce, según el artículo 3.1 de la LOSU, en virtud del derecho fundamental recogido en:","o":["El artículo 27.10 de la Constitución","El artículo 20 de la Constitución","El artículo 44 de la Constitución","El artículo 103 de la Constitución"],"c":0,"ref":["LOSU","3","el derecho fundamental reconocido en el artículo 27.10 de la constitución española"],"e":"Art. 3.1 LOSU."},{"q":"Según el artículo 3.3 de la LOSU, la autonomía universitaria garantiza:","o":["La libertad de cátedra del profesorado","La inamovilidad del personal","La exención de todo control financiero","La gratuidad de la matrícula"],"c":0,"ref":["LOSU","3","la autonomía universitaria garantiza la libertad de cátedra del profesorado"],"e":"Art. 3.3 LOSU: libertad en la docencia, la investigación y el estudio."},{"q":"¿Cuál de las siguientes competencias NO forma parte de la autonomía universitaria según el artículo 3.2 de la LOSU?","o":["La elaboración de sus Estatutos","El establecimiento de sus relaciones de puestos de trabajo o plantillas","La aprobación del presupuesto general del Estado","La expedición de los títulos correspondientes a las enseñanzas oficiales"],"c":2,"ref":["LOSU","3","el establecimiento de sus relaciones de puestos de trabajo o plantillas"],"e":"El presupuesto general del Estado lo aprueban las Cortes Generales; no es competencia universitaria."},{"q":"Según el artículo 3.5 de la LOSU, en el ejercicio de su autonomía las universidades deberán:","o":["Rendir cuentas a la sociedad del uso de sus medios y recursos","Obtener autorización previa del Gobierno para cada gasto","Someterse a la dirección del Consejo de Universidades","Delegar su gestión financiera en la Comunidad Autónoma"],"c":0,"ref":["LOSU","3","rendir cuentas a la sociedad del uso de sus medios y recursos humanos, materiales y económicos"],"e":"Art. 3.5 LOSU."},{"q":"¿Cómo se crean las universidades públicas según el artículo 4.1.a) de la LOSU?","o":["Por ley de la Asamblea Legislativa de la Comunidad Autónoma, previo informe preceptivo de la Conferencia General de Política Universitaria","Por real decreto del Consejo de Ministros","Por resolución del Rector de la universidad matriz","Por orden del Ministerio de Universidades"],"c":0,"ref":["LOSU","4","por ley de la asamblea legislativa de la comunidad autónoma"],"e":"Art. 4.1.a) LOSU."},{"q":"Según el artículo 4.2 de la LOSU, ¿a quién corresponde autorizar el inicio de actividades de una universidad?","o":["A los órganos competentes de la Comunidad Autónoma en la que radique la universidad","Al Consejo de Ministros","A la ANECA","A la Conferencia General de Política Universitaria"],"c":0,"ref":["LOSU","4","corresponde a los órganos competentes de la comunidad autónoma en la que radique la universidad otorgar la autorización para el inicio de sus actividades"],"e":"Art. 4.2 LOSU."},{"q":"¿Qué agencia es competente, junto a las autonómicas inscritas en EQAR, para la acreditación y evaluación del profesorado universitario según el artículo 5.4?","o":["ANECA","CRUE","REBIUN","CNMC"],"c":0,"ref":["LOSU","5","agencia nacional de evaluación de la calidad y acreditación"],"e":"Art. 5.4 LOSU: ANECA."},{"q":"Según el artículo 6.1 de la LOSU, la docencia universitaria, preferentemente presencial:","o":["Podrá impartirs function iniciar(id,solo){const t=info(id);if(!t){location.hash='#/';return}
  let ps=(t.preguntas||t.muestra).map((p,i)=>({...p,n:i}));if(solo)ps=ps.filter(p=>solo.includes(p.n));
  T={id,solo:!!solo,muestra:!t.preguntas,fin:false,i:0,res:[],fb:false,qs:mezcla(ps).map(p=>{const o=mezcla([0,1,2,3]);return {...p,opts:o.map(k=>p.o[k]),corr:o.indexOf(p.c)}})}}
function citaHtml(p){const [k,a,c]=p.ref;return `<p class="cita">${esc(LEYES[k]||k)}${a==='doc'?'':', art. '+esc(a)}: <q>${esc(c)}</q></p>`}
function vTest(app,id){if(!T||T.id!==id||T.fin&&!T.mostrar)iniciar(id);if(!T)return;
  if(T.fin)return vResultado(app);
  const q=T.qs[T.i],r=T.res[T.i],L='ABCD';
  app.innerHTML=`
  <p><a href="${TEMAS[id]?'#/tema/'+id:'#temario'}">${TEMAS[id]?'← Apuntes':'← Temario'}</a></p>
  <div class="row"><span class="chip">${esc(info(id).titulo.split(' ').slice(0,4).join(' '))}…</span>${T.muestra?'<span class="chip">muestra gratuita</span>':''}<span class="chip mono">pregunta ${T.i+1} de ${T.qs.length}</span></div>
  <section class="card"><h2 style="margin-bottom:10px">${esc(q.q)}</h2>
    <div role="group" aria-label="Opciones">${q.opts.map((o,i)=>{const cls=T.fb?(i===q.corr?' ok':(r&&r.sel===i?' ko':'')):'';
      return `<button type="button" class="opt${cls}" data-o="${i}" ${T.fb?'disabled':''}><span class="l">${L[i]}</span><span>${esc(o)}</span></button>`}).join('')}</div>
    ${T.fb?'':`<button type="button" class="btn ghost sm" data-o="-1">No lo sé (en blanco)</button>`}
    <div aria-live="polite">${T.fb?`<div class="fb ${r.sel===q.corr?'ok':'ko'}"><strong>${r.sel===null?'En blanco.':r.sel===q.corr?'¡Correcto!':'Incorrecto.'}</strong> La respuesta es ${L[q.corr]}. ${esc(q.e)}${citaHtml(q)}</div>
      <p style="margin-top:12px"><button type="button" class="btn acc" id="sig">${T.i>=T.qs.length-1?'Ver resultado':'Siguiente'}</button></p>`:''}</div>
  </section>`;
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const s=+b.dataset.o;T.res[T.i]={sel:s<0?null:s};T.fb=true;vTest(app,id);const s2=$('#sig');s2&&s2.focus()});
  const sg=$('#sig');if(sg)sg.onclick=()=>{if(T.i>=T.qs.length-1){terminar(id);return}T.i++;T.fb=false;vTest(app,id);window.scrollTo(0,0)}}
function terminar(id){let ok=0,ko=0,bl=0;const mal=[];
  T.qs.forEach((q,i)=>{const r=T.res[i];if(!r||r.sel===null)bl++;else if(r.sel===q.corr)ok++;else{ko++;mal.push(q.n)}});
  const n=T.qs.length,p=pct(ok,ko,n);T.r={ok,ko,bl,n,p,mal};T.fin=true;T.mostrar=true;
  if(!T.solo){(S.tests[id]=S.tests[id]||[]).push({pct:p,ok,ko,bl,n,t:Date.now()});S.tests[id]=S.tests[id].slice(-20);guardar()}
  vResultado($('#app'))}
function vResultado(app){const r=T.r,id=T.id,nota=Math.max(0,r.ok-r.ko/PEN)/r.n*10;
  app.innerHTML=`
  <section class="card stack"><div class="eyebrow">Resultado</div>
    <p class="big">${r.p} %</p>
    <p>${r.ok} aciertos · ${r.ko} fallos · ${r.bl} en blanco de ${r.n} preguntas. Con la fórmula del examen (cada fallo resta 0,25 aciertos) equivale a <strong>${nota.toFixed(1).replace('.',',')} sobre 10</strong>.</p>
    <p class="muted">${r.p>=75?'Buen nivel: tema casi dominado. Repasa los fallos y sigue.':r.p>=60?'Vas bien, pero repasa los apuntes de lo que has fallado.':'Todavía flojo: vuelve a los apuntes y repite el test.'}</p>
    <div class="row">${r.mal.length?`<button type="button" class="btn acc" id="rep">Repasar mis ${r.mal.length} fallos</button>`:''}<button type="button" class="btn" id="otra">Repetir el test</button>${TEMAS[id]?`<a class="btn ghost" href="#/tema/${id}">Apuntes</a>`:''}<a class="btn ghost" href="#/">Inicio</a></div></section>
  ${T.muestra?`<section class="aviso"><h2>Esto era una muestra</h2><p style="margin-top:6px">El tema completo incluye ${info(id).n} preguntas con cita y los apuntes. Este tema está bloqueado en la versión gratuita.</p></section>`:''}`;
  const rep=$('#rep');if(rep)rep.onclick=()=>{iniciar(id,T.r.mal);vTest(app,id)};
  $('#otra').onclick=()=>{iniciar(id);vTest(app,id)}}


/* ---------- Cuenta (Supabase propio por API REST; correo y contraseña; sin librerías de terceros) ---------- */
const CFG=window.RUTA_CFG||{}, AUTH_ON=!!(CFG.url&&CFG.key), VPRIV=CFG.versionPrivacidad||'2026-10-28', KS=KEY+'-ses', MINPASS=8;
try{SES=JSON.parse(localStorage.getItem(KS)||'null')}catch(e){}
function guardaSes(){try{SES?localStorage.setItem(KS,JSON.stringify(SES)):localStorage.removeItem(KS)}catch(e){}}
function ponSesion(j){SES={at:j.access_token,rt:j.refresh_token,exp:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),uid:j.user?j.user.id:null,email:j.user?j.user.email:null};guardaSes()}
async function api(path,{method='GET',body,token,prefer}={}){
  const h={apikey:CFG.key,'Content-Type':'application/json',Authorization:'Bearer '+(token||CFG.key)};if(prefer)h.Prefer=prefer;
  const r=await fetch(CFG.url+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw Object.assign(new Error((j&&(j.msg||j.message||j.error_description||j.error_code))||String(r.status)),{status:r.status,code:j&&(j.error_code||j.code)});
  return j}
async function tokenValido(){if(!SES)return null;if(SES.exp-60>Date.now()/1000)return SES.at;
  try{const j=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:SES.rt}});ponSesion(j);return SES.at}
  catch(e){if(e.status===400||e.status===401||e.status===403){SES=null;guardaSes();nube='local';pintaCuenta()}return null}}
async function subir(){const t=await tokenValido();if(!t||!SES||!SES.uid)return;
  await api('/rest/v1/progreso',{method:'POST',token:t,prefer:'resolution=merge-duplicates',body:{user_id:SES.uid,estado:S,upd:S.upd||0}})}
async function sincroniza(){const t=await tokenValido();if(!t){nube='local';pintaCuenta();return}
  try{if(!SES.uid||!SES.email){const u=await api('/auth/v1/user',{token:t});SES.uid=u.id;SES.email=u.email;guardaSes()}
    const r=await api('/rest/v1/progreso?user_id=eq.'+SES.uid+'&select=estado,upd',{token:t});
    if(r&&r[0]&&(r[0].upd||0)>(S.upd||0)){S=Object.assign({leidos:{},tests:{}},r[0].estado,{upd:r[0].upd});try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
    await subir();nube='ok'}catch(e){nube='error'}
  pintaCuenta();if(!T&&!/^#\/test/.test(location.hash))render()}
function pintaCuenta(){const c=$('#chip-nube'),b=$('#cta-cuenta');if(!c||!b)return;
  c.hidden=!SES;c.textContent=nube==='ok'?'sincronizada':nube==='error'?'sin conexión':'conectando…';
  b.textContent=SES?'Mi cuenta':'Entrar o registrarme';b.hidden=!AUTH_ON&&!SES}
const redir=()=>encodeURIComponent(location.origin+location.pathname);
function capturaEnlace(){const h=location.hash;if(!/access_token=|error_description=|error_code=/.test(h))return;   // vuelta del correo (confirmación o recuperación)
  const p=new URLSearchParams(h.replace(/^#\/?/,''));const at=p.get('access_token'),tipo=p.get('type');
  if(at){ponSesion({access_token:at,refresh_token:p.get('refresh_token'),expires_at:+p.get('expires_at')||0,expires_in:+p.get('expires_in')||3600});
    window.__modo=tipo==='recovery'?'nueva':null;window.__ok=tipo==='signup'||tipo==='email_change'?'Correo confirmado. Ya has entrado.':null}
  else window.__err='El enlace ha caducado o ya se usó. Pide uno nuevo.';
  history.replaceState(null,'',location.pathname+location.search);location.hash='#/cuenta'}
async function crearCuenta(email,pass){
  const j=await api('/auth/v1/signup?redirect_to='+redir(),{method:'POST',body:{email,password:pass,data:{acepta_privacidad:true,version_privacidad:VPRIV}}});
  if(j&&j.access_token){ponSesion(j);return'dentro'}return'confirmar'}
async function entrar(email,pass){ponSesion(await api('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password:pass}}))}
async function recuperar(email){await api('/auth/v1/recover?redirect_to='+redir(),{method:'POST',body:{email}})}
async function nuevaClave(pass){await api('/auth/v1/user',{method:'PUT',token:await tokenValido(),body:{password:pass}})}
async function salir(){const t=SES&&SES.at;SES=null;guardaSes();nube='local';
  if(t){try{await api('/auth/v1/logout',{method:'POST',token:t})}catch(e){}}pintaCuenta()}
function msgError(e){const c=e.code||'';
  if(c==='invalid_credentials')return'Correo o contraseña incorrectos.';
  if(c==='email_not_confirmed')return'Aún no has confirmado tu correo. Abre el enlace que te enviamos.';
  if(c==='user_already_exists'||c==='email_exists')return'Ya existe una cuenta con ese correo. Entra o recupera tu contraseña.';
  if(c==='weak_password')return'La contraseña es demasiado débil. Usa al menos '+MINPASS+' caracteres, con letras y números.';
  if(c==='same_password')return'La nueva contraseña debe ser distinta de la anterior.';
  if(c==='over_email_send_rate_limit'||e.status===429)return'Demasiados intentos seguidos. Espera unos minutos y vuelve a probar.';
  if(c==='unexpected_failure'||e.status>=500)return'No hemos podido enviar el correo. Inténtalo en unos minutos o escríbenos a '+DATOS.contacto+'.';
  return'No se ha podido completar la operación. Inténtalo de nuevo en unos minutos.'+(c?' (código: '+c+')':'')}
function vCuenta(app){
  const volver='<p><a href="#/">← Inicio</a></p>';
  if(!AUTH_ON){app.innerHTML=volver+`<section class="card stack"><h1>Cuenta</h1><p>El registro se abrirá en breve. Mientras tanto puedes estudiar los temas abiertos sin cuenta: tu progreso se guarda en este dispositivo.</p></section>`;return}
  const ok=window.__ok?`<p role="status"><strong>${esc(window.__ok)}</strong></p>`:'', er=window.__err?`<p class="err" role="alert">${esc(window.__err)}</p>`:'';
  const campoPass=(id,etq,auto)=>`<label for="${id}"><strong>${etq}</strong></label><input type="password" id="${id}" autocomplete="${auto}" minlength="${MINPASS}" required>`;
  const pie='<p class="err" id="msg" role="alert" hidden></p>';
  const err=t=>{const m=$('#msg');m.textContent=t;m.hidden=false};
  if(SES&&window.__modo==='nueva'){
    app.innerHTML=volver+`<section class="card stack"><h1>Elige tu contraseña</h1>${ok}<form id="frm" class="stack" novalidate>${campoPass('pw','Nueva contraseña (mínimo '+MINPASS+' caracteres)','new-password')}${pie}<div class="row"><button class="btn acc" type="submit" id="env">Guardar contraseña</button></div></form></section>`;
    $('#frm').onsubmit=async ev=>{ev.preventDefault();const pw=$('#pw').value;if(pw.length<MINPASS){err('Usa al menos '+MINPASS+' caracteres.');return}
      try{await nuevaClave(pw);window.__modo=null;window.__ok='Contraseña guardada.';sincroniza();render()}catch(e){err(msgError(e))}};return}
  if(SES){app.innerHTML=volver+`<section class="card stack"><h1>Mi cuenta</h1>${ok}
    <p>Has entrado como <strong>${esc(SES.email||'…')}</strong>. Tu progreso se sincroniza entre tus dispositivos <span class="muted">(${nube==='ok'?'al día':nube==='error'?'sin conexión ahora':'conectando…'})</span>.</p>
    <div class="row"><button type="button" class="btn" id="salir">Cerrar sesión</button><button type="button" class="btn ghost" id="cambiar">Cambiar contraseña</button>
    <a class="btn ghost" href="mailto:${esc(CONTACTO)}?subject=${encodeURIComponent('Eliminar mi cuenta de Ruta a la Plaza')}&amp;body=${encodeURIComponent('Solicito la supresión de mi cuenta y de mis datos. Correo de la cuenta: '+(SES.email||''))}">Pedir que eliminen mi cuenta</a></div>
    <p class="muted">Más información en la <a href="legal/privacidad-rutaalaplaza.html">política de privacidad</a>.</p></section>`;
    $('#salir').onclick=async()=>{window.__ok=null;await salir();location.hash='#/'};
    $('#cambiar').onclick=()=>{window.__modo='nueva';window.__ok=null;render()};return}
  const tab=window.__tab||'entrar';
  const tabs=`<div class="row" role="tablist"><button type="button" class="btn ${tab==='entrar'?'':'ghost'} sm" id="t-entrar">Entrar</button><button type="button" class="btn ${tab==='crear'?'':'ghost'} sm" id="t-crear">Crear cuenta</button></div>`;
  let cuerpo;
  if(tab==='crear')cuerpo=`<h1>Crear cuenta gratis</h1><p>Con cuenta, tu progreso se guarda en la nube y lo ves desde cualquier dispositivo. Dejamos constancia de tu alta (correo, fecha y versión de la política aceptada), como explica la <a href="legal/privacidad-rutaalaplaza.html">política de privacidad</a>.</p>
    <form id="frm" class="stack" novalidate><label for="em"><strong>Correo electrónico</strong></label><input type="email" id="em" autocomplete="email" inputmode="email" required placeholder="nombre@ejemplo.com">
    ${campoPass('pw','Contraseña (mínimo '+MINPASS+' caracteres)','new-password')}
    <label class="chk"><input type="checkbox" id="pv" required><span>He leído y acepto la <a href="legal/privacidad-rutaalaplaza.html" target="_blank" rel="noopener">política de privacidad</a>.</span></label>${pie}
    <div class="row"><button class="btn acc" type="submit" id="env">Crear cuenta</button></div></form>`;
  else if(tab==='olvido')cuerpo=`<h1>Recuperar contraseña</h1><p>Escribe tu correo y te enviaremos un enlace para elegir una contraseña nueva.</p>
    <form id="frm" class="stack" novalidate><label for="em"><strong>Correo electrónico</strong></label><input type="email" id="em" autocomplete="email" inputmode="email" required>${pie}
    <div class="row"><button class="btn acc" type="submit" id="env">Enviarme el enlace</button><button type="button" class="btn ghost" id="t-entrar">Volver</button></div></form>`;
  else cuerpo=`<h1>Entrar</h1><form id="frm" class="stack" novalidate><label for="em"><strong>Correo electrónico</strong></label><input type="email" id="em" autocomplete="email" inputmode="email" required>
    ${campoPass('pw','Contraseña','current-password')}${pie}
    <div class="row"><button class="btn acc" type="submit" id="env">Entrar</button><button type="button" class="btn ghost sm" id="t-olvido">He olvidado mi contraseña</button></div></form>`;
  app.innerHTML=volver+`<section class="card stack">${tab==='olvido'?'':tabs}${ok}${er}${cuerpo}</section>`;
  const ir=t=>()=>{window.__tab=t;window.__ok=window.__err=null;render()};
  const te=$('#t-entrar'),tc=$('#t-crear'),to=$('#t-olvido');if(te)te.onclick=ir('entrar');if(tc)tc.onclick=ir('crear');if(to)to.onclick=ir('olvido');
  const mailOk=em=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em);
  $('#frm').onsubmit=async ev=>{ev.preventDefault();const em=$('#em').value.trim(),b=$('#env'),txt=b.textContent;$('#msg').hidden=true;
    if(!mailOk(em)){err('Escribe un correo válido.');return}
    const pw=tab==='olvido'?null:$('#pw').value;
    if(tab!=='olvido'&&!pw){err('Escribe tu contraseña.');return}
    if(tab==='crear'){if(pw.length<MINPASS){err('La contraseña debe tener al menos '+MINPASS+' caracteres.');return}if(!$('#pv').checked){err('Para registrarte debes aceptar la política de privacidad.');return}}
    b.disabled=true;b.textContent='Un momento…';
    try{
      if(tab==='crear'){const r=await crearCuenta(em,pw);window.__tab='entrar';
        if(r==='dentro'){sincroniza();render()}else $('#frm').innerHTML=`<p><strong>Revisa tu correo.</strong> Te hemos enviado un enlace a <strong>${esc(em)}</strong> para confirmar tu cuenta. Después podrás entrar con tu contraseña. Si no llega en unos minutos, mira en spam.</p>`}
      else if(tab==='olvido'){await recuperar(em);$('#frm').innerHTML=`<p><strong>Revisa tu correo.</strong> Si existe una cuenta con <strong>${esc(em)}</strong>, te hemos enviado un enlace para elegir una contraseña nueva.</p>`}
      else{await entrar(em,pw);window.__ok=window.__err=null;sincroniza();render()}}
    catch(e){b.disabled=false;b.textContent=txt;err(msgError(e))}}}

/* ---------- Router ---------- */
function render(){const app=$('#app'),h=location.hash.replace(/^#\/?/,'').split('/');
  pintaCuenta();
  if(h[0]==='tema')vTema(app,h[1]);else if(h[0]==='test')vTest(app,h[1]);else if(h[0]==='cuenta')vCuenta(app);else vInicio(app);
  const ancla=!['tema','test','cuenta'].includes(h[0])&&h[0]&&document.getElementById(h[0]);   // enlaces internos: #gratis, #temario
  if(ancla)ancla.scrollIntoView();else if(h[0]!=='test'||!T)window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{T=location.hash.startsWith('#/test/')?T:null;render()});
$('#borrar').onclick=()=>{if(confirm('¿Borrar el progreso guardado en este dispositivo?')){S={leidos:{},tests:{}};try{localStorage.removeItem(KEY)}catch(e){}if(SES){S.upd=Date.now();subir().catch(()=>{})}toast('Progreso borrado');render()}};
capturaEnlace();render();if(SES)sincroniza();
</script>
